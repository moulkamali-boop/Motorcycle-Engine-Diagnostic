<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:0.8rem;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:680px;width:100%;background:#111827;border-radius:2rem;padding:1.2rem;border:2px solid #f5b81b;box-shadow:0 20px 40px -10px #00000080}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f5b81b;padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
.title-box{text-align:center;flex:1;min-width:60%}
.title-fixed{font-size:1.1rem;font-weight:800;color:#f5b81b;text-align:center;letter-spacing:0.5px;cursor:default;line-height:1.3}
.title-dynamic{font-size:0.85rem;font-weight:500;color:#fff;text-align:center;margin-top:3px}
.logo-btn{width:44px;height:44px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:0.2s;user-select:none}
.logo-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.icon-btn{width:40px;height:40px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:0.2s}
.icon-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.meta-row{display:flex;justify-content:space-between;background:#1e293b;padding:6px 14px;border-radius:30px;font-size:0.75rem;margin:4px 0;color:#fff;flex-wrap:wrap;gap:4px}
.meta-row .meta-item{display:flex;align-items:center;gap:4px;color:#cbd5e1;font-size:0.75rem}
.meta-row .meta-item span{color:#fff}
.lang-id-row{display:flex;gap:6px;margin:6px 0}
.lang-id-row select,.lang-id-row .id-box{flex:1;padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:30px;font-size:0.7rem;color:#fff}
.lang-id-row select{appearance:auto;cursor:pointer}
.id-box{text-align:center;font-family:monospace}
.credit-section{background:#0f172a;border:2px solid #1e293b;border-radius:16px;padding:10px;margin:6px 0}
.free-badge{font-weight:600;color:#f5b81b;font-size:0.8rem;text-align:center}
.pack-row{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.pack-btn{background:#1e293b;border:1px solid #f5b81b;border-radius:30px;padding:6px 10px;font-size:0.75rem;cursor:pointer;color:#fff;text-align:center;font-weight:500;width:100%;transition:0.2s}
.pack-btn:hover{background:#f5b81b;color:#0a0f1a}
.code-row{display:flex;gap:6px;margin-top:4px}
.code-row input{flex:1;padding:4px 10px;background:#1e293b;border:1px solid #334155;border-radius:30px;color:#fff;font-size:0.7rem}
.code-row button{background:#3b82f6;border:none;border-radius:30px;padding:4px 14px;color:#fff;font-weight:600;cursor:pointer;font-size:0.7rem;transition:0.2s}
.code-row button:hover{background:#2563eb}
.code-row button:disabled{opacity:0.5;cursor:not-allowed}
.divider{height:2px;background:linear-gradient(90deg,transparent,#f5b81b,transparent);margin:8px 0;opacity:0.6}
.start-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;font-weight:700;color:#0a0f1a;font-size:1rem;cursor:pointer;margin:8px 0;transition:0.2s;letter-spacing:0.5px}
.start-btn:hover{transform:scale(1.02);box-shadow:0 0 30px #f5b81b44}
.final-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;font-weight:700;color:#fff;font-size:1rem;cursor:pointer;margin:8px 0;transition:0.2s}
.final-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 30px #10b98144}
#labArea{display:none;margin-top:10px}
.sensor-card{background:#0f172a;border:3px solid #334155;border-radius:16px;padding:12px;margin-bottom:10px;transition:0.3s}
.sensor-card.measuring{border-color:#3b82f6;background:#1e3a8a22}
.sensor-card.done{border-color:#2ecc71;background:#064e3b44}
.sensor-card.failed{border-color:#ef4444;background:#7f1d1d44}
.sensor-card.skipped{border-color:#f59e0b;background:#78350f44}
.sensor-card.confirmed{border-color:#10b981;background:#065f4644;box-shadow:0 0 16px #10b98144}
.sensor-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:0.9rem;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.sensor-header .tool{font-size:0.6rem;color:#94a3b8;font-weight:400}
.sensor-icon{font-size:1.6rem;margin-left:4px;display:inline-block;vertical-align:middle}
.sensor-instruction{font-size:0.7rem;color:#cbd5e1;margin:4px 0 6px 0;padding:4px 12px;background:#1e293b;border-radius:30px;border:1px solid #334155;display:inline-block}
.sensor-preview{background:#000;border-radius:12px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#94a3b8;border:1px solid #334155;margin:6px 0;padding:6px;flex-direction:column;text-align:center}
.sensor-result{font-size:0.85rem;font-weight:700;color:#fff;margin:4px 0;min-height:20px}
.sensor-result.sub{font-size:0.7rem;color:#cbd5e1;font-weight:400;min-height:14px}
.sensor-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sensor-actions button{padding:8px 4px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.7rem;transition:0.2s}
.sensor-actions button:disabled{opacity:0.35;cursor:not-allowed;filter:grayscale(0.6)}
.sensor-actions button:hover:not(:disabled){transform:scale(1.03)}
.btn-measure{background:#3b82f6;color:#fff}
.btn-measure:hover:not(:disabled){background:#2563eb}
.btn-retry{background:#f59e0b;color:#0a0f1a}
.btn-retry:hover:not(:disabled){background:#d97706}
.btn-done{background:#10b981;color:#fff}
.btn-done:hover:not(:disabled){background:#059669}
.btn-skip{background:#6c7a92;color:#fff}
.btn-skip:hover:not(:disabled){background:#f59e0b;color:#0a0f1a}
.note-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:12px;margin:10px 0}
.note-title{font-size:0.85rem;font-weight:700;color:#f5b81b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.note-buttons{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.note-buttons button{flex:1;padding:8px 10px;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:0.75rem;transition:0.2s;min-width:80px}
.btn-speak{background:#8b5cf6;color:#fff}
.btn-speak:hover:not(:disabled){background:#7c3aed}
.btn-speak:disabled{opacity:0.4;cursor:not-allowed}
.btn-write{background:#06b6d4;color:#fff}
.btn-write:hover:not(:disabled){background:#0891b2}
#noteTextArea{width:100%;min-height:60px;padding:8px 10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:0.8rem;font-family:inherit;resize:vertical;display:none}
#noteTextArea:focus{border-color:#f5b81b;outline:none}
#recordingIndicator{display:none;align-items:center;justify-content:center;gap:8px;font-size:0.75rem;color:#f5b81b;padding:6px;margin-top:4px}
#recordingIndicator.active{display:flex}
#recordingIndicator .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
.final-verdict{background:#0f172a;border-radius:20px;padding:16px;margin-top:10px;text-align:center;border:3px solid #334155;display:none;transition:0.3s}
.final-verdict.show{display:block}
.final-verdict.green{background:#064e3b;border-color:#2ecc71}
.final-verdict.yellow{background:#78350f;border-color:#f59e0b}
.final-verdict.orange{background:#7f1d1d;border-color:#ef4444}
.final-verdict.gray{background:#1e293b;border-color:#6c7a92}
.final-icon{font-size:2.4rem;margin-bottom:6px}
.verdict-sentence{font-size:0.95rem;font-weight:700;color:#fff;background:#0f172a;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.6;text-align:right}
.verdict-solution{font-size:0.9rem;font-weight:600;color:#4ade80;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;text-align:right}
.verdict-note{font-size:0.85rem;color:#f5b81b;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;font-style:italic;text-align:right}
.sensor-count-notice{font-size:0.8rem;font-weight:600;padding:8px 12px;border-radius:30px;margin:8px 0;display:inline-block}
.sensor-count-notice.good{background:#2ecc7133;color:#2ecc71;border:1px solid #2ecc71}
.sensor-count-notice.partial{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
.sensor-count-notice.limited{background:#ef444433;color:#ef4444;border:1px solid #ef4444}
.sensor-count-notice.none{background:#6c7a9233;color:#94a3b8;border:1px solid #6c7a92}
.verdict-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.verdict-actions button{flex:1;padding:12px 14px;border:none;border-radius:40px;font-weight:700;cursor:pointer;font-size:0.85rem;transition:0.2s;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-return{background:#334155;color:#fff;border:2px solid #64748b}
.btn-return:hover{background:#475569;transform:scale(1.02)}
.toolbar{display:flex;gap:6px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.tool-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:8px 14px;font-size:0.75rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:0.2s;flex:1;justify-content:center;min-width:70px}
.tool-btn:hover{background:#2d3a4e;border-color:#f5b81b}
.tool-btn i{font-size:0.9rem;color:#f5b81b}
.rating{text-align:center;font-size:0.75rem;color:#94a3b8;margin:8px 0}
.stars{color:#f5b81b;font-size:1.1rem}
.stars span{cursor:pointer;transition:0.2s;display:inline-block}
.stars span:hover{transform:scale(1.2)}
.consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.consent-overlay.show{display:flex}
.consent-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:20px;max-width:400px;width:100%;text-align:center}
.consent-box .legal-icon{font-size:2.4rem;margin-bottom:8px}
.consent-box h2{color:#f5b81b;font-size:1.1rem;margin-bottom:8px}
.consent-box .legal-text{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:8px 0}
.consent-box .btn-consent{background:#f5b81b;border:none;padding:10px 24px;border-radius:40px;font-weight:700;color:#0a0f1a;cursor:pointer;font-size:0.9rem;margin-top:8px;transition:0.2s;width:100%}
.consent-box .btn-consent:hover{transform:scale(1.02)}
.consent-box .btn-refuse{background:#334155;border:none;padding:8px 20px;border-radius:40px;font-weight:600;color:#94a3b8;cursor:pointer;font-size:0.85rem;margin-top:6px;transition:0.2s;width:100%}
.consent-box .btn-refuse:hover{background:#475569;color:#fff}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:22px;max-width:420px;width:100%;text-align:center}
.confirm-box .icon{font-size:2.5rem;margin-bottom:8px}
.confirm-box h3{color:#f5b81b;font-size:1.05rem;margin-bottom:10px}
.confirm-box .msg{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:6px 0;text-align:center}
.confirm-box .msg.warning{color:#f59e0b;font-weight:600}
.confirm-box .msg.safe{color:#4ade80;font-weight:600}
.confirm-box .btn-confirm{background:linear-gradient(135deg,#10b981,#059669);border:none;padding:12px 24px;border-radius:40px;font-weight:700;color:#fff;cursor:pointer;font-size:0.9rem;margin-top:8px;width:100%;transition:0.2s}
.confirm-box .btn-confirm:hover{transform:scale(1.02)}
.confirm-box .btn-cancel{background:#334155;border:none;padding:10px 24px;border-radius:40px;font-weight:600;color:#cbd5e1;cursor:pointer;font-size:0.85rem;margin-top:6px;width:100%;transition:0.2s}
.confirm-box .btn-cancel:hover{background:#475569;color:#fff}
.secret-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
.secret-modal.show{display:flex}
.secret-box{background:#1e293b;padding:20px;border-radius:24px;text-align:center;border:2px solid #f5b81b;max-width:340px;width:90%}
.secret-box .lock-icon{font-size:2.6rem;color:#f5b81b}
.secret-box h3{color:#f5b81b;margin:6px 0;font-size:1rem}
.secret-box p{color:#cbd5e1;font-size:0.75rem;margin-bottom:10px}
.secret-box input{background:#0f172a;border:2px solid #f5b81b;border-radius:40px;padding:10px 14px;color:#fff;width:100%;margin:10px 0;font-size:0.9rem;text-align:center;letter-spacing:4px}
.secret-box .btn-confirm{background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;padding:10px 16px;font-weight:700;color:#0a0f1a;cursor:pointer;width:100%;font-size:0.85rem;transition:0.2s}
.secret-box .btn-confirm:hover{transform:scale(1.02)}
.secret-box .btn-close{background:#555;border:none;border-radius:40px;padding:8px 14px;font-weight:700;color:#fff;cursor:pointer;width:100%;margin-top:6px;font-size:0.8rem;transition:0.2s}
.secret-box .btn-close:hover{background:#777}
.secret-box .btn-reset{background:transparent;border:none;color:#94a3b8;font-size:0.7rem;cursor:pointer;margin-top:8px;text-decoration:underline}
.secret-box .btn-reset:hover{color:#f5b81b}
.toast-custom{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #f5b81b;color:#fff;padding:8px 18px;border-radius:40px;font-size:0.75rem;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,0.6);text-align:center;max-width:90%;font-weight:500;display:none}
.purchase-prompt{display:none;background:#0f172a;border:2px solid #f59e0b;border-radius:16px;padding:14px;margin:10px 0;text-align:center}
.purchase-prompt.show{display:block}
.purchase-prompt .pp-icon{font-size:2rem;margin-bottom:6px}
.purchase-prompt .pp-title{color:#f59e0b;font-weight:700;font-size:0.95rem;margin-bottom:6px}
.purchase-prompt .pp-msg{color:#cbd5e1;font-size:0.8rem;margin-bottom:10px;line-height:1.5}
.legal-line{font-size:0.55rem;color:#94a3b8;margin-top:8px;border-top:1px solid #334155;padding-top:8px;font-weight:300;text-align:center}
.legal-line strong{color:#f5b81b}

/* ═══════════ الصفحات القانونية ═══════════ */
.legal-links-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 8px;padding-top:12px;border-top:1px solid #334155}
.legal-link-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:6px 12px;font-size:0.7rem;color:#cbd5e1;cursor:pointer;font-family:inherit;transition:0.2s;display:flex;align-items:center;gap:4px}
.legal-link-btn:hover{background:#2d3a4e;border-color:#f5b81b;color:#f5b81b}
.legal-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:4000;padding:16px;backdrop-filter:blur(4px)}
.legal-modal-overlay.show{display:flex}
.legal-modal-box{background:#1e293b;border:2px solid #f5b81b;border-radius:20px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.legal-modal-header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 8px;border-bottom:2px solid #334155}
.legal-modal-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.legal-modal-tabs button{background:#0f172a;border:none;color:#94a3b8;padding:8px 10px;font-size:0.65rem;font-weight:600;cursor:pointer;font-family:inherit;border-radius:10px 10px 0 0;white-space:nowrap;transition:0.2s;display:flex;align-items:center;gap:3px}
.legal-modal-tabs button.active{background:#1e293b;color:#f5b81b;box-shadow:inset 0 -2px 0 #f5b81b}
.legal-modal-tabs button:hover:not(.active){color:#cbd5e1}
.legal-modal-close-x{background:transparent;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.legal-modal-close-x:hover{color:#ef4444}
.legal-modal-body{flex:1;overflow-y:auto;padding:16px 20px;color:#cbd5e1;font-size:0.78rem;line-height:1.85;text-align:right;direction:rtl}
.legal-modal-body h4{color:#f5b81b;font-size:0.85rem;margin:12px 0 6px;border-right:3px solid #f5b81b;padding-right:8px}
.legal-modal-body h4:first-child{margin-top:0}
.legal-modal-body p{margin-bottom:8px}
.legal-modal-body ul{padding-right:20px;margin-bottom:8px}
.legal-modal-body li{margin-bottom:4px}
.legal-modal-body a{color:#f5b81b;text-decoration:none;word-break:break-all}
.legal-modal-body a:hover{text-decoration:underline}
.legal-modal-footer{padding:8px 12px;border-top:1px solid #334155;display:flex;justify-content:center}
.legal-modal-close-btn{background:#334155;border:none;border-radius:40px;padding:8px 24px;color:#fff;font-weight:600;cursor:pointer;font-size:0.8rem;font-family:inherit;transition:0.2s;display:flex;align-items:center;gap:6px}
.legal-modal-close-btn:hover{background:#475569}

/* ═══════════ سجل الفحوصات (جديد) ═══════════ */
.history-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:10px;margin:10px 0;display:none}
.history-section.show{display:block}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #334155}
.history-title{font-size:0.85rem;font-weight:700;color:#f5b81b;display:flex;align-items:center;gap:6px}
.history-count{font-size:0.7rem;color:#94a3b8;background:#1e293b;padding:2px 8px;border-radius:20px}
.history-list{max-height:280px;overflow-y:auto;margin:6px 0}
.history-item{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:0.2s;display:flex;justify-content:space-between;align-items:center;font-size:0.75rem}
.history-item:hover{border-color:#f5b81b;background:#2d3a4e}
.history-item .h-date{color:#cbd5e1;display:flex;flex-direction:column;gap:2px;flex:1}
.history-item .h-date .h-date-top{color:#fff;font-weight:600}
.history-item .h-date .h-date-bottom{color:#94a3b8;font-size:0.65rem}
.history-item .h-status{font-weight:700;padding:3px 10px;border-radius:20px;font-size:0.7rem;white-space:nowrap}
.history-item .h-status.good{background:#2ecc7133;color:#2ecc71;border:1px solid #2ecc71}
.history-item .h-status.partial{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
.history-item .h-status.none{background:#6c7a9233;color:#94a3b8;border:1px solid #6c7a92}
.history-empty{text-align:center;color:#94a3b8;font-size:0.8rem;padding:20px;font-style:italic}
.history-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #334155}

.btn-history-clear{background:#7f1d1d;color:#fff}

.history-detail-overlay.show{display:flex}
.history-detail-box{background:#1e293b;border:2px solid #f5b81b;border-radius:20px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto}
.history-detail-box h3{color:#f5b81b;font-size:1rem;margin-bottom:12px;text-align:center}
.history-detail-box .detail-row{background:#0f172a;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:0.8rem;color:#cbd5e1;display:flex;justify-content:space-between}
.history-detail-box .detail-row .lbl{color:#94a3b8}
.history-detail-box .detail-row .val{color:#fff;font-weight:600}
.history-detail-box .detail-close{background:#334155;border:none;border-radius:40px;padding:10px;color:#fff;font-weight:600;cursor:pointer;font-size:0.85rem;font-family:inherit;width:100%;margin-top:12px;transition:0.2s}
.history-detail-box .detail-close:hover{background:#475569}

.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px;overflow-y:auto}
.report-overlay.show{display:flex}
.report-container{background:#fff;color:#1a1a1a;border-radius:16px;max-width:720px;width:100%;padding:30px;direction:ltr;font-family:'Segoe UI',system-ui,sans-serif}
.report-header{text-align:center;border-bottom:3px solid #f5b81b;padding-bottom:15px;margin-bottom:20px}
.report-header h1{font-size:1.6rem;color:#0a0f1a;margin-bottom:6px}
.report-header .subtitle{color:#666;font-size:0.85rem}
.report-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;font-size:0.85rem}
.report-info div{padding:8px 12px;background:#f5f5f5;border-radius:8px;border-left:3px solid #f5b81b}
.report-info strong{color:#0a0f1a;display:block;font-size:0.7rem;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px}
.report-section{margin-bottom:18px}
.report-section h2{font-size:1rem;color:#0a0f1a;border-left:4px solid #f5b81b;padding-left:10px;margin-bottom:12px;font-weight:700}
.report-section .sensor-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f9f9f9;border-radius:8px;margin-bottom:6px;font-size:0.85rem;border-left:3px solid #ccc}
.report-section .sensor-row.ok{border-left-color:#10b981;background:#f0fdf4}
.report-section .sensor-row.skip{border-left-color:#f59e0b;background:#fffbeb}

.report-verdict{background:#f0f9f0;border-left:4px solid #10b981;padding:16px;border-radius:8px;margin-bottom:10px}
.report-verdict p{color:#0a0f1a;font-size:0.9rem;line-height:1.6;margin-bottom:6px}
.report-verdict .solution{color:#166534;font-size:0.85rem;padding:8px 12px;background:#dcfce7;border-radius:6px;margin-top:8px}
.report-note{background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:0.85rem;color:#78350f;margin-top:10px;font-style:italic}

.report-watermark{text-align:center;font-size:0.7rem;color:#94a3b8;margin-top:24px;padding-top:12px;border-top:1px dashed #cbd5e1;font-style:italic}
.report-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.report-actions button{flex:1;padding:12px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.9rem;transition:0.2s;min-width:130px}
.report-actions button:hover{transform:scale(1.02)}
.btn-print-pdf{background:#dc2626;color:#fff}
.btn-print-pdf:hover{background:#b91c1c}
.btn-close-report{background:#6b7280;color:#fff}
.btn-close-report:hover{background:#4b5563}

// 🔐 تشفير AES-GCM لسجل الفحوصات
// ═══════════════════════════════════════════════════════
async function getCryptoKey() {
    let salt = localStorage.getItem(SALT_KEY);
    if (!salt) {
        salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
            .map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(SALT_KEY, salt);
    }
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
        'raw', enc.encode(navigator.userAgent + salt),
        'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
}

async function encryptData(obj) {
    try {
        const key = await getCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const cipher = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv }, key,
            new TextEncoder().encode(JSON.stringify(obj))
        );
        return JSON.stringify({ iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) });
    } catch (e) { return null; }
}

async function decryptData(stored) {
    try {
        const { iv, data } = JSON.parse(stored);
        const key = await getCryptoKey();
        const plain = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: new Uint8Array(iv) }, key,
            new Uint8Array(data)
        );
        return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) { return null; }
}

// ═══════════════════════════════════════════════════════
// 🔐 كلمة مرور المطور (SHA-256)
// ═══════════════════════════════════════════════════════
async function sha256Hex(str) {
    if (window.crypto && crypto.subtle) {
        try {
            const enc = new TextEncoder().encode(str);
            const buf = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
    }
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
        h2 = Math.imul(h2 ^ (c + i), 2654435761) >>> 0;
    }
    return 'fb_' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

function getAdminHash() { return localStorage.getItem(ADMIN_HASH_KEY); }
async function setAdminPassword(password) {
    const hash = await sha256Hex(password);
    localStorage.setItem(ADMIN_HASH_KEY, hash);
}
async function verifyAdminPassword(password) {
    const storedHash = getAdminHash();
    if (!storedHash) return false;
    return (await sha256Hex(password)) === storedHash;
}
function sanitizeLegacyHash() {
    const stored = getAdminHash();
    if (!stored) return;
    const isSha256 = /^[a-f0-9]{64}$/i.test(stored);
    const isFallback = /^fb_[a-f0-9]{16}$/i.test(stored);
    if (!isSha256 && !isFallback) localStorage.removeItem(ADMIN_HASH_KEY);
}

        if (!raw) return;

}

// 💳 Gumroad API
// ═══════════════════════════════════════════════════════
async function verifyGumroadLicense(key) {
    for (const permalink in GUMROAD_PRODUCTS) {
        try {
            const res = await fetch('https://api.gumroad.com/v2/licenses/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ product_permalink: permalink, license_key: key, increment_uses_count: 'false' })
            });
            const data = await res.json();
            if (data && data.success && data.purchase && !data.purchase.refunded && !data.purchase.chargebacked) {
                try {
                    await fetch('https://api.gumroad.com/v2/licenses/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ product_permalink: permalink, license_key: key, increment_uses_count: 'true' })
                    });
                } catch (e) {}
                return { valid: true, credits: GUMROAD_PRODUCTS[permalink], uses: data.uses || 0 };
            }
        } catch (e) {}
    }
    return { valid: false };
}

function updateAllSensorUIs() { for (let id = 1; id <= 3; id++) updateSensorUI(id); }

function updateSensorUI(id) {
    const card = document.getElementById('card' + id);
    const preview = document.getElementById('previewText' + id);
    const result = document.getElementById('result' + id);
    const subResult = document.getElementById('subResult' + id);
    const mBtn = document.getElementById('measure' + id);
    const rBtn = document.getElementById('retry' + id);
    const dBtn = document.getElementById('done' + id);
    const sBtn = document.getElementById('skip' + id);
    mBtn.disabled = true; rBtn.disabled = true; dBtn.disabled = true; sBtn.disabled = false;
    const st = sensorState[id];
    card.className = 'sensor-card';

    if (st.status === 'measuring') {
        card.classList.add('measuring');
        preview.textContent = '⏳ ' + t('measuring', 0);
        sBtn.disabled = true;
        return;
    }
    if (st.status === 'done' && st.confirmed) {
        card.classList.add('confirmed');
        preview.textContent = '✅ ' + t('confirmed_msg');
        result.textContent = '📊 ' + (st.value || '');
        subResult.textContent = st.sub || '';
        rBtn.disabled = false; sBtn.disabled = false;
        return;
    }
    if (st.status === 'done') {
        card.classList.add('done');
        preview.textContent = '✅ ' + t('measure_done');
        result.textContent = '📊 ' + (st.value || '');
        subResult.textContent = st.sub || '';
        rBtn.disabled = false; dBtn.disabled = false; sBtn.disabled = false;
        return;
    }
    if (st.status === 'failed') {
        card.classList.add('failed');
        preview.textContent = '⚠️ ' + t('measure_failed');
        result.textContent = ''; subResult.textContent = '';
        mBtn.disabled = false; rBtn.disabled = false; sBtn.disabled = false;
        return;
    }
    if (st.status === 'skipped') {
        card.classList.add('skipped');
        preview.textContent = '⏭ ' + t('skipped_msg');
        result.textContent = ''; subResult.textContent = '';
        mBtn.disabled = false; sBtn.disabled = false;
        return;
    }
    preview.textContent = '🔓 ' + t('waiting');
    result.textContent = ''; subResult.textContent = '';
    mBtn.disabled = false; sBtn.disabled = false;
}

// ═══════════════════════════════════════════════════════
// ⚡ إجراءات المستشعرات
// ═══════════════════════════════════════════════════════
async function measureSensor(id) {
    if (sensorState[id].status === 'measuring') return;
    if (!consentGiven) { window._pendingSensor = id; document.getElementById('consentOverlay').classList.add('show'); return; }
    if (sensorState[id].status === 'skipped') sensorState[id].status = 'idle';
    sensorState[id] = { status: 'measuring', value: null, sub: null, confirmed: false };
    updateSensorUI(id);
    try {
        let value = null, sub = null;
        if (id === 1) { const r = await measureSound(); value = r.value; sub = r.sub; }
        else if (id === 2) { const r = await measureSmoke(); value = r.value; sub = r.sub; }
        else if (id === 3) { const r = await measureVibration(); value = r.value; sub = r.sub; }
        if (value === null) throw new Error('no value');
        sensorState[id] = { status: 'done', value, sub, confirmed: false };
        updateSensorUI(id);
    } catch (err) {
        sensorState[id] = { status: 'failed', value: null, sub: null, confirmed: false };
        updateSensorUI(id);
    }
}
function retrySensor(id) {
    cleanupStreams(id);
    sensorState[id] = { status: 'idle', value: null, sub: null, confirmed: false };
    updateSensorUI(id);
}
function confirmSensor(id) {
    if (sensorState[id].status !== 'done') { showToast('⚠️ ' + t('not_measured')); return; }
    sensorState[id].confirmed = true;
    updateSensorUI(id);
    showToast('✅ ' + t('confirmed_msg'));
}
function skipSensor(id) {
    cleanupStreams(id);
    sensorState[id] = { status: 'skipped', value: null, sub: null, confirmed: false };
    updateSensorUI(id);
}
function cleanupStreams(id) {
    if (id === 1 && streams.audio) {
        try { streams.audio.getTracks().forEach(t => t.stop()); } catch(e) {}
        streams.audio = null;
        if (streams.audioContext) { try { streams.audioContext.close(); } catch(e) {} streams.audioContext = null; }
        streams.analyser = null;
    }
    if (id === 2 && streams.video) {
        try { streams.video.getTracks().forEach(t => t.stop()); } catch(e) {}
        streams.video = null;
    }
    if (id === 3 && motionHandler) {
        window.removeEventListener('devicemotion', motionHandler);
        motionHandler = null;
    }
}

// ═══════════════════════════════════════════════════════
// 🎤 قياس الصوت
// ═══════════════════════════════════════════════════════
async function measureSound() {
    return new Promise(async (resolve) => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            streams.audio = stream;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            streams.audioContext = ctx;
            const source = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            streams.analyser = analyser;
            const data = new Uint8Array(analyser.frequencyBinCount);
            let peak = 0, sum = 0, samples = 0;
            const startTime = Date.now();
            const interval = setInterval(() => {
                analyser.getByteFrequencyData(data);
                let s = 0;
                for (let i = 0; i < data.length; i++) s += data[i];
                const avg = s / data.length;
                sum += avg; samples++;
                if (avg > peak) peak = avg;
                if (Date.now() - startTime > 2500) {
                    clearInterval(interval);
                    cleanupStreams(1);
                    const avgLevel = sum / Math.max(samples, 1);
                    if (avgLevel < 5) { resolve({ value: null, sub: null }); return; }
                    let profile = 'profile_normal';
                    if (avgLevel > 80) profile = 'profile_very_strong';
                    else if (avgLevel > 50) profile = 'profile_strong';
                    else if (avgLevel > 25) profile = 'profile_weak';
                    const freq = Math.round(peak * 2);
                    resolve({
                        value: t(profile) + ' (' + freq + ' Hz)',
                        sub: t('metric_intensity') + ': ' + Math.round(avgLevel)
                    });
                }
            }, 100);
        } catch (e) {
            cleanupStreams(1);
            resolve({ value: null, sub: null });
        }
    });
}

// ═══════════════════════════════════════════════════════
// 📸 قياس الدخان
// ═══════════════════════════════════════════════════════
async function measureSmoke() {
    return new Promise(async (resolve) => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            streams.video = stream;
            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', 'true');
            video.muted = true;
            await video.play();
            const canvas = document.createElement('canvas');
            canvas.width = 160; canvas.height = 120;
            const ctx = canvas.getContext('2d');
            let sumR = 0, sumG = 0, sumB = 0, frames = 0;
            const startTime = Date.now();
            const interval = setInterval(() => {
                ctx.drawImage(video, 0, 0, 160, 120);
                const img = ctx.getImageData(0, 0, 160, 120).data;
                let r = 0, g = 0, b = 0;
                for (let i = 0; i < img.length; i += 4) { r += img[i]; g += img[i+1]; b += img[i+2]; }
                const px = img.length / 4;
                sumR += r/px; sumG += g/px; sumB += b/px;
                frames++;
                if (Date.now() - startTime > 2500) {
                    clearInterval(interval);
                    cleanupStreams(2);
                    const avgR = sumR/frames, avgG = sumG/frames, avgB = sumB/frames;
                    const brightness = (avgR + avgG + avgB) / 3;
                    if (brightness < 5 || brightness > 250) { resolve({ value: null, sub: null }); return; }
                    let profile = 'profile_gray', colorKey = 'profile_gray';
                    if (brightness > 200) { profile = 'profile_white_dense'; colorKey = 'profile_white_dense'; }
                    else if (brightness > 150) { profile = 'profile_white_light'; colorKey = 'profile_white_light'; }
                    else if (avgB > avgR + 20 && avgB > avgG + 20) { profile = 'profile_blue'; colorKey = 'profile_blue'; }
                    else if (brightness < 60) { profile = 'profile_black_dark'; colorKey = 'profile_black_dark'; }
                    else if (brightness < 100) { profile = 'profile_black'; colorKey = 'profile_black'; }
                    else if (avgR > 180 && avgG > 180 && avgB > 180) { profile = 'profile_steam'; colorKey = 'profile_steam'; }
                    resolve({
                        value: t(profile),
                        sub: t('metric_color') + ': ' + t(colorKey) + ' • ' + t('metric_intensity') + ': ' + Math.round(brightness)
                    });
                }
            }, 100);
        } catch (e) {
            cleanupStreams(2);
            resolve({ value: null, sub: null });
        }
    });
}

// ═══════════════════════════════════════════════════════
// 📳 قياس الاهتزاز
// ═══════════════════════════════════════════════════════
async function measureVibration() {
    return new Promise((resolve) => {
        if (typeof DeviceMotionEvent === 'undefined') { resolve({ value: null, sub: null }); return; }
        let magnitudes = [], peak = 0;
        const handler = (event) => {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc) return;
            const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
            const mag = Math.sqrt(x*x + y*y + z*z);
            magnitudes.push(mag);
            if (mag > peak) peak = mag;
        };
        motionHandler = handler;
        window.addEventListener('devicemotion', handler);
        setTimeout(() => {
            window.removeEventListener('devicemotion', handler);
            motionHandler = null;
            if (magnitudes.length < 20) { resolve({ value: null, sub: null }); return; }
            const avg = magnitudes.reduce((a, b) => a + b, 0) / magnitudes.length;
            const variance = magnitudes.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / magnitudes.length;
            const stdDev = Math.sqrt(variance);
            if (stdDev < 0.15) { resolve({ value: null, sub: null }); return; }
            let profile = 'profile_normal';
            if (avg > 25) profile = 'profile_very_strong';
            else if (avg > 15) profile = 'profile_strong';
            else if (avg > 8) profile = 'profile_weak';
            else if (stdDev > 5) profile = 'profile_irregular';
            resolve({
                value: t(profile),
                sub: t('metric_intensity') + ': ' + avg.toFixed(2) + ' m/s²'
            });
        }, 2500);
    });
}

async function loadHistory() {
    try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (!raw) return;
        let d = await decryptData(raw);
        if (!d) { try { d = JSON.parse(raw); } catch (e) { return; } }
        if (Array.isArray(d)) historyData = d.slice(0, 50);
    } catch (e) {}
}

async function saveHistory() {
    if (!finalShown) return;
    const confirmed = getConfirmedCount();
    const measured = getMeasuredCount();
    let verdictText = document.getElementById('verdictSentence').textContent || '';
    let solText = document.getElementById('verdictSolution').textContent || '';
    const entry = {
        id: 'REC-' + Date.now(),
        date: new Date().toISOString(),
        deviceId: document.getElementById('deviceId').textContent,
        sensors: {
            1: { status: sensorState[1].status, value: sensorState[1].value, confirmed: sensorState[1].confirmed },
            2: { status: sensorState[2].status, value: sensorState[2].value, confirmed: sensorState[2].confirmed },
            3: { status: sensorState[3].status, value: sensorState[3].value, confirmed: sensorState[3].confirmed }
        },
        measured: measured,
        confirmed: confirmed,
        verdictText: verdictText,
        solText: solText,
        note: (document.getElementById('noteTextArea').value || '').trim()
    };
    historyData.unshift(entry);
    if (historyData.length > 50) historyData = historyData.slice(0, 50);
    const enc = await encryptData(historyData);
    if (enc) localStorage.setItem(HISTORY_KEY, enc);
    else try { localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData)); } catch (e) {}
}

function openHistory() {
    document.getElementById('historySection').classList.add('show');
    renderHistory();
    document.getElementById('historySection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function closeHistory() {
    document.getElementById('historySection').classList.remove('show');
}

function renderHistory() {
    const list = document.getElementById('historyList');
    const emptyEl = document.getElementById('historyEmpty');
    const countEl = document.getElementById('historyCount');
    countEl.textContent = historyData.length;
    if (historyData.length === 0) {
        list.innerHTML = '<div class="history-empty">' + t('history_empty') + '</div>';
        return;
    }
    let html = '';
    historyData.forEach((h, i) => {
        const d = new Date(h.date);
        const dateStr = d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB').slice(0,5);
        let cls = 'none';
        if (h.confirmed === 3) cls = 'good';
        else if (h.confirmed >= 1) cls = 'partial';
        let shortText = '';
        if (h.verdictText && h.verdictText.length > 30) shortText = h.verdictText.slice(0, 40) + '...';
        else shortText = h.verdictText || t('no_data');
        html += '<div class="history-item" onclick="showHistoryDetail(' + i + ')">';
        html += '<div class="h-date">';
        html += '<span class="h-date-top">🕐 ' + dateStr + '</span>';
        html += '<span class="h-date-bottom">' + shortText + '</span>';
        html += '</div>';
        html += '<span class="h-status ' + cls + '">' + h.measured + '/3</span>';
        html += '</div>';
    });
    list.innerHTML = html;
}

async function clearHistory() {
    if (confirm(t('history_clear') + '؟')) {
        historyData = [];
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
        showToast('🗑️ ' + t('history_cleared'));
    }
}

function exportHistory() {
    if (historyData.length === 0) { showToast('⚠️ ' + t('history_empty')); return; }
    try {
        const blob = new Blob([JSON.stringify(historyData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bike-checks-history-' + new Date().toISOString().slice(0,10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('📤 ' + t('history_exported'));
    } catch (e) {
        showToast('❌ ' + t('network_error'));
    }
}

function showHistoryDetail(idx) {
    const h = historyData[idx];
    if (!h) return;
    const box = document.getElementById('historyDetailBox');
    const d = new Date(h.date);
    let html = '<h3>📋 ' + t('history_detail_title') + '</h3>';
    html += '<div class="detail-row"><span class="lbl">🕐 ' + t('report_time') + '</span><span class="val">' + d.toLocaleString('en-GB') + '</span></div>';
    html += '<div class="detail-row"><span class="lbl">🆔 ' + t('report_device') + '</span><span class="val">' + h.deviceId + '</span></div>';
    html += '<div class="detail-row"><span class="lbl">📊 ' + t('sensor_count_0').replace('❌ ','') + '</span><span class="val">' + h.measured + '/3</span></div>';
    for (let i = 1; i <= 3; i++) {
        const s = h.sensors[i];
        const icon = i === 1 ? '🎤' : i === 2 ? '📸' : '📳';
        let status = t('not_measured');
        if (s && s.status === 'done') status = s.value || '✅';
        else if (s && s.status === 'skipped') status = '⏭ ' + t('skipped_msg');
        html += '<div class="detail-row"><span class="lbl">' + icon + ' ' + t('sensor' + i) + '</span><span class="val">' + status + '</span></div>';
    }
    if (h.verdictText) html += '<div class="detail-row" style="flex-direction:column;align-items:flex-start"><span class="lbl">📋 ' + t('report_verdict') + '</span><span class="val" style="margin-top:4px">' + h.verdictText + '</span></div>';
    if (h.solText) html += '<div class="detail-row" style="flex-direction:column;align-items:flex-start"><span class="lbl">🔧 ' + t('report_solution') + '</span><span class="val" style="margin-top:4px">' + h.solText + '</span></div>';
    if (h.note) html += '<div class="detail-row" style="flex-direction:column;align-items:flex-start"><span class="lbl">💭 ' + t('note_title').replace('؟','') + '</span><span class="val" style="margin-top:4px;font-style:italic">' + h.note + '</span></div>';
    html += '<button class="detail-close" onclick="closeHistoryDetail()">✖ ' + t('history_detail_close') + '</button>';
    box.innerHTML = html;
    document.getElementById('historyDetailOverlay').classList.add('show');
}
function closeHistoryDetail() {
    document.getElementById('historyDetailOverlay').classList.remove('show');
}

function startLab() {
    document.getElementById('labArea').style.display = 'block';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').style.opacity = '0.5';
    document.getElementById('labArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    for (let i = 1; i <= 3; i++) {
        cleanupStreams(i);
        sensorState[i] = { status: 'idle', value: null, sub: null, confirmed: false };
        updateSensorUI(i);
    }
    finalShown = false;
    userNote = '';
    document.getElementById('noteTextArea').value = '';
    document.getElementById('noteTextArea').style.display = 'none';
    document.getElementById('finalVerdict').classList.remove('show');
    if (window._pendingSensor) {
        const id = window._pendingSensor;
        window._pendingSensor = null;
        setTimeout(() => measureSensor(id), 300);
    }
}

function toggleNoteText() {
    const ta = document.getElementById('noteTextArea');
    if (ta.style.display === 'block') { ta.style.display = 'none'; userNote = ta.value; }
    else { ta.style.display = 'block'; ta.focus(); }
}
function startVoiceNote() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('⚠️ ' + t('voice_not_supported')); toggleNoteText(); return; }
    if (isRecording) return;
    isRecording = true;
    document.getElementById('recordingIndicator').classList.add('active');
    document.getElementById('speakBtn').disabled = true;
    recognition = new SR();
    recognition.lang = currentLang === 'ar' ? 'ar-SA' :
                       currentLang === 'fr' ? 'fr-FR' :
                       currentLang === 'es' ? 'es-ES' :
                       currentLang === 'de' ? 'de-DE' :
                       currentLang === 'it' ? 'it-IT' :
                       currentLang === 'pt' ? 'pt-PT' :
                       currentLang === 'ru' ? 'ru-RU' :
                       currentLang === 'zh' ? 'zh-CN' :
                       currentLang === 'ja' ? 'ja-JP' : 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = e => {
        const text = e.results[0][0].transcript;
        const ta = document.getElementById('noteTextArea');
        ta.style.display = 'block';
        ta.value = (ta.value ? ta.value + ' ' : '') + text;
        userNote = ta.value;
    };
    recognition.onerror = () => {};
    recognition.onend = () => { stopVoiceNote(); };
    try { recognition.start(); } catch (e) { stopVoiceNote(); }
    recordingTimeout = setTimeout(() => stopVoiceNote(), 5000);
}
function stopVoiceNote() {
    if (!isRecording) return;
    isRecording = false;
    clearTimeout(recordingTimeout);
    document.getElementById('recordingIndicator').classList.remove('active');
    document.getElementById('speakBtn').disabled = false;
    try { if (recognition) recognition.stop(); } catch (e) {}
    const ta = document.getElementById('noteTextArea');
    if (ta) userNote = ta.value;
}

    if (navigator.share) navigator.share({ title: title, text: text }).catch(() => {});
    else copyAction();
}

function printReport() {
    if (!finalShown) { showToast('⚠️ ' + t('final_btn_label')); return; }
    const container = document.getElementById('reportContainer');
    const now = new Date();
    let sensorRows = '';
    for (let i = 1; i <= 3; i++) {
        const st = sensorState[i];
        const icon = i === 1 ? '🎤' : i === 2 ? '📸' : '📳';
        let statusClass = 'none', statusText = t('not_measured'), valueText = '—';
        if (st.status === 'done' && st.confirmed) { statusClass = 'ok'; statusText = '✅ ' + t('confirmed_msg'); valueText = st.value || '—'; }
        else if (st.status === 'done') { statusClass = 'ok'; statusText = '⚡ ' + t('measure_done'); valueText = st.value || '—'; }
        else if (st.status === 'skipped') { statusClass = 'skip'; statusText = '⏭ ' + t('skipped_msg'); }
        sensorRows += '<div class="sensor-row ' + statusClass + '"><span>' + icon + ' ' + t('sensor' + i) + '</span><span>' + statusText + ' | ' + valueText + '</span></div>';
    }
    const verdictSentence = document.getElementById('verdictSentence').textContent || t('no_data');
    const verdictSolution = document.getElementById('verdictSolution').textContent || '';
    const sensorCount = document.getElementById('sensorCountNotice').textContent || '';
    const noteText = (document.getElementById('noteTextArea').value || '').trim();
    let html = '';
    html += '<div class="report-header"><h1>🏍️ Motorcycle Engine Symptom Estimator</h1><div class="subtitle">' + t('app_title') + '</div></div>';
    html += '<div class="report-info">';
    html += '<div><strong>' + t('report_device') + '</strong>' + document.getElementById('deviceId').textContent + '</div>';
    html += '<div><strong>' + t('report_date') + '</strong>' + now.toLocaleDateString('en-GB') + '</div>';
    html += '<div><strong>' + t('report_time') + '</strong>' + now.toLocaleTimeString('en-GB') + '</div>';
    html += '</div>';
    html += '<div class="report-section"><h2>📊 ' + t('report_sensors_used') + '</h2>' + sensorRows + '</div>';
    html += '<div class="report-section"><h2>📋 ' + t('report_verdict') + '</h2>';
    html += '<div class="report-verdict"><p>' + verdictSentence + '</p>';
    if (verdictSolution && verdictSolution.length > 3) html += '<div class="solution">🔧 ' + verdictSolution + '</div>';
    html += '</div>';
    html += '<div style="text-align:center;font-size:0.75rem;color:#666;margin-top:8px">' + sensorCount + '</div></div>';
    if (noteText.length >= 4) html += '<div class="report-note">💭 ' + noteText + '</div>';
    html += '<div class="report-disclaimer">⚠️ ' + t('legal') + '</div>';
    html += '<div class="report-watermark">Powered by Motorcycle Engine Symptom Estimator<br>motorcycle-engine-diagnostic.pages.dev</div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-print-pdf" onclick="window.print()">' + t('report_print_pdf') + '</button>';
    html += '<button class="btn-close-report" onclick="closeReport()">✖ ' + t('report_close_btn') + '</button>';
    html += '</div>';
    container.innerHTML = html;
    document.getElementById('reportOverlay').classList.add('show');
}
function closeReport() { document.getElementById('reportOverlay').classList.remove('show'); }

                paidCredits += result.credits;

function initLocation() {
    const el = document.getElementById('locationDisplay');
    if (!el) return;
    if (!navigator.geolocation) { locationStatus = 'unavailable'; el.textContent = t('location_unavailable'); return; }
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude.toFixed(4);
            const lon = pos.coords.longitude.toFixed(4);
            locationStatus = lat + ', ' + lon;
            el.textContent = locationStatus;
        },
        () => { locationStatus = 'denied'; el.textContent = t('location_denied'); },
        { timeout: 8000 }
    );
}

function attachLogoEvents() {
    const logoBtn = document.getElementById('logoBtn');
    if (!logoBtn) return;
    logoBtn.addEventListener('click', () => {
        logoClickCount++;
        clearTimeout(logoClickTimer);
        if (logoClickCount >= 5) { logoClickCount = 0; openAdminModal(); return; }
        logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 2000);
    });
}

    setInterval(updateDateTime, 1000);
    initLocation();
