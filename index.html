<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1a">
<title>🏍️ Motorcycle Engine Symptom Estimator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0f1a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8F%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:0.8rem;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:680px;width:100%;background:#111827;border-radius:2rem;padding:1.2rem;border:2px solid #f5b81b;box-shadow:0 20px 40px -10px #00000080}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f5b81b;padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
.title-box{text-align:center;flex:1;min-width:60%}
.title-fixed{font-size:1.1rem;font-weight:800;color:#f5b81b;text-align:center;letter-spacing:0.5px;line-height:1.3}
.title-dynamic{font-size:0.85rem;font-weight:500;color:#fff;text-align:center;margin-top:3px}
.logo-btn{width:44px;height:44px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:0.2s;user-select:none}
.logo-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.icon-btn{width:40px;height:40px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:0.2s}
.icon-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.meta-row{display:flex;justify-content:space-between;background:#1e293b;padding:6px 14px;border-radius:30px;font-size:0.75rem;margin:4px 0;color:#fff;flex-wrap:wrap;gap:4px}
.meta-row .meta-item{display:flex;align-items:center;gap:4px;color:#cbd5e1;font-size:0.75rem}
.meta-row .meta-item span{color:#fff}
.lang-id-row{display:flex;gap:6px;margin:6px 0}
.lang-id-row select,.lang-id-row .id-box{flex:1;padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:30px;font-size:0.7rem;color:#fff}
.lang-id-row select{appearance:auto;cursor:pointer}
.id-box{text-align:center;font-family:monospace}
.credit-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:14px;margin:8px 0}
.credit-display{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:#1e293b;border-radius:30px;font-weight:700;font-size:0.9rem}
.credit-display .icon{font-size:1.1rem}
.credit-display .label{color:#cbd5e1;font-weight:600;font-size:0.85rem}
.credit-display .value{color:#f5b81b;font-family:monospace;font-size:1.5rem;font-weight:900;min-width:32px;text-align:center}
.credit-display.low .value{color:#f59e0b}
.credit-display.empty .value{color:#ef4444}
.credit-hint{text-align:center;font-size:0.7rem;color:#94a3b8;margin-top:6px;font-style:italic}
.packs-divider{height:1px;background:#334155;margin:12px 0;opacity:0.5}
.packs-title{font-size:0.8rem;color:#f5b81b;font-weight:700;margin:6px 0 8px 0;text-align:center}
.pack-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.pack-btn{background:#1e293b;border:2px solid #f5b81b;border-radius:14px;padding:11px 6px;font-size:0.75rem;cursor:pointer;color:#fff;text-align:center;font-weight:600;transition:0.2s;display:flex;flex-direction:column;gap:2px;align-items:center;font-family:inherit}
.pack-btn:hover{background:#f5b81b;color:#0a0f1a;transform:translateY(-2px)}
.pack-btn .amount{font-size:1.2rem;font-weight:900;font-family:monospace;color:#f5b81b}
.pack-btn:hover .amount{color:#0a0f1a}
.pack-btn .price{font-size:0.7rem;color:#cbd5e1}
.pack-btn:hover .price{color:#0a0f1a}
.code-title{font-size:0.8rem;color:#f5b81b;font-weight:700;margin:14px 0 6px 0;text-align:center}
.code-row{display:flex;gap:6px;margin-top:4px}
.code-row input{flex:1;padding:8px 12px;background:#1e293b;border:1px solid #334155;border-radius:30px;color:#fff;font-size:0.75rem;font-family:inherit}
.code-row input:focus{outline:none;border-color:#f5b81b}
.code-row button{background:#3b82f6;border:none;border-radius:30px;padding:8px 16px;color:#fff;font-weight:600;cursor:pointer;font-size:0.75rem;transition:0.2s;white-space:nowrap;font-family:inherit}
.code-row button:hover{background:#2563eb}
.code-row button:disabled{opacity:0.5;cursor:not-allowed}
.divider{height:2px;background:linear-gradient(90deg,transparent,#f5b81b,transparent);margin:8px 0;opacity:0.6}
.start-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;font-weight:700;color:#0a0f1a;font-size:1rem;cursor:pointer;margin:8px 0;transition:0.2s;font-family:inherit}
.start-btn:hover{transform:scale(1.02);box-shadow:0 0 30px #f5b81b44}
.start-btn:disabled{opacity:0.5;cursor:not-allowed}
#labArea{display:none;margin-top:10px}
.sensor-card{background:#0f172a;border:3px solid #334155;border-radius:16px;padding:12px;margin-bottom:10px;transition:0.3s}
.sensor-card.measuring{border-color:#3b82f6;background:#1e3a8a22}
.sensor-card.done{border-color:#2ecc71;background:#064e3b44}
.sensor-card.failed{border-color:#ef4444;background:#7f1d1d44}
.sensor-card.skipped{border-color:#f59e0b;background:#78350f44}
.sensor-card.confirmed{border-color:#10b981;background:#065f4644;box-shadow:0 0 16px #10b98144}
.sensor-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:0.9rem;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.sensor-header .tool{font-size:0.6rem;color:#94a3b8;font-weight:400}
.sensor-icon{font-size:1.6rem;margin-left:4px;display:inline-block;vertical-align:middle}
.sensor-instruction{font-size:0.7rem;color:#cbd5e1;margin:4px 0 6px 0;padding:4px 12px;background:#1e293b;border-radius:30px;border:1px solid #334155;display:inline-block}
.sensor-preview{background:#000;border-radius:12px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#94a3b8;border:1px solid #334155;margin:6px 0;padding:6px;flex-direction:column;text-align:center}
.sensor-result{font-size:0.85rem;font-weight:700;color:#fff;margin:4px 0;min-height:20px}
.sensor-result.sub{font-size:0.7rem;color:#cbd5e1;font-weight:400;min-height:14px}
.sensor-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sensor-actions button{padding:8px 4px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.7rem;transition:0.2s;font-family:inherit}
.sensor-actions button:disabled{opacity:0.35;cursor:not-allowed;filter:grayscale(0.6)}
.sensor-actions button:hover:not(:disabled){transform:scale(1.03)}
.btn-measure{background:#3b82f6;color:#fff}
.btn-retry{background:#f59e0b;color:#0a0f1a}
.btn-done{background:#10b981;color:#fff}
.btn-skip{background:#6c7a92;color:#fff}
.info-btn{width:26px;height:26px;background:#3b82f6;border:1px solid #3b82f6;border-radius:50%;color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:0.2s;margin-left:8px;font-family:inherit;vertical-align:middle}
.info-btn:hover{background:#2563eb;transform:scale(1.1)}
.info-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:none;align-items:center;justify-content:center;z-index:4500;padding:16px;backdrop-filter:blur(4px)}
.info-modal-overlay.show{display:flex}
.info-modal-box{background:#1e293b;border:2px solid #3b82f6;border-radius:20px;max-width:520px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.info-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid #334155;background:#0f172a}
.info-modal-title{font-size:1rem;font-weight:700;color:#3b82f6;flex:1}
.info-modal-close{background:transparent;border:none;color:#94a3b8;font-size:1.3rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.info-modal-close:hover{color:#ef4444}
.info-modal-body{flex:1;overflow-y:auto;padding:18px 20px;color:#cbd5e1;font-size:0.82rem;line-height:1.85;text-align:right}
.info-modal-body h4{color:#3b82f6;font-size:0.85rem;margin:14px 0 8px 0;border-right:3px solid #3b82f6;padding-right:8px;font-weight:700}
.info-modal-body h4:first-child{margin-top:0}
.info-modal-body p{margin:6px 0;color:#e2e8f0}
.info-modal-body .formula{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;margin:8px 0;font-family:'Courier New',monospace;font-size:0.78rem;color:#67e8f9;direction:ltr;text-align:left;overflow-x:auto;white-space:pre}
.info-modal-body .ref{background:#0f172a;border-right:3px solid #f5b81b;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:0.75rem;color:#cbd5e1;font-style:italic}
.info-modal-body .sensor-badge{display:inline-block;background:#3b82f622;color:#3b82f6;border:1px solid #3b82f6;border-radius:20px;padding:3px 10px;font-size:0.7rem;font-weight:600;margin-bottom:6px}
.info-modal-footer{padding:10px 14px;border-top:1px solid #334155;display:flex;justify-content:center;background:#0f172a}
.info-modal-close-btn{background:#334155;border:none;border-radius:40px;padding:8px 24px;color:#fff;font-weight:600;cursor:pointer;font-size:0.8rem;font-family:inherit}
.dev-section{display:none;margin-top:16px;padding-top:16px;border-top:2px dashed #8b5cf6}
.dev-section.show{display:block}
.dev-section .dev-header{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:#a78bfa;font-weight:700;margin-bottom:10px;background:#1e1b4b;padding:6px 12px;border-radius:20px;border:1px solid #8b5cf6}
.dev-section .dev-header::before{content:'🔬';font-size:1rem}
.note-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:12px;margin:10px 0}
.note-title{font-size:0.85rem;font-weight:700;color:#f5b81b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.note-buttons{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.note-buttons button{flex:1;padding:8px 10px;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:0.75rem;transition:0.2s;min-width:80px;font-family:inherit}
.btn-speak{background:#8b5cf6;color:#fff}
.btn-write{background:#06b6d4;color:#fff}
#noteTextArea{width:100%;min-height:60px;padding:8px 10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:0.8rem;font-family:inherit;resize:vertical;display:none}
#noteTextArea:focus{border-color:#f5b81b;outline:none}
#recordingIndicator{display:none;align-items:center;justify-content:center;gap:8px;font-size:0.75rem;color:#f5b81b;padding:6px;margin-top:4px}
#recordingIndicator.active{display:flex}
#recordingIndicator .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
.back-to-lab-btn{width:100%;padding:11px 14px;background:#1e293b;border:2px solid #64748b;border-radius:40px;font-weight:700;color:#e2e8f0;font-size:0.9rem;cursor:pointer;margin:4px 0 6px;transition:0.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.back-to-lab-btn:hover{background:#334155;border-color:#f5b81b;color:#f5b81b;transform:scale(1.01)}
.final-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;font-weight:700;color:#fff;font-size:1rem;cursor:pointer;margin:8px 0;transition:0.2s;font-family:inherit}
.final-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 30px #10b98144}
.final-verdict{background:#0f172a;border-radius:20px;padding:16px;margin-top:10px;text-align:center;border:3px solid #334155;display:none;transition:0.3s}
.final-verdict.show{display:block}
.final-verdict.green{background:#064e3b;border-color:#2ecc71}
.final-verdict.yellow{background:#78350f;border-color:#f59e0b}
.final-verdict.orange{background:#7f1d1d;border-color:#ef4444}
.final-verdict.gray{background:#1e293b;border-color:#6c7a92}
.final-icon{font-size:2.4rem;margin-bottom:6px}
.verdict-sentence{font-size:0.95rem;font-weight:700;color:#fff;background:#0f172a;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.6;text-align:right}
.verdict-solution{font-size:0.85rem;font-weight:600;color:#4ade80;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;text-align:right}
.sensor-count-notice{font-size:0.8rem;font-weight:600;padding:8px 12px;border-radius:30px;margin:8px 0;display:inline-block}
.sensor-count-notice.good{background:#2ecc7133;color:#2ecc71;border:1px solid #2ecc71}
.sensor-count-notice.partial{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
.sensor-count-notice.limited{background:#ef444433;color:#ef4444;border:1px solid #ef4444}
.sensor-count-notice.none{background:#6c7a9233;color:#94a3b8;border:1px solid #6c7a92}
.verdict-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.verdict-actions button{flex:1;padding:12px 14px;border:none;border-radius:40px;font-weight:700;cursor:pointer;font-size:0.85rem;transition:0.2s;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn-return{background:#334155;color:#fff;border:2px solid #64748b}
.btn-return:hover{background:#475569;transform:scale(1.02)}
.toolbar{display:flex;gap:6px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.tool-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:8px 14px;font-size:0.75rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:0.2s;flex:1;justify-content:center;min-width:70px;font-family:inherit}
.tool-btn:hover{background:#2d3a4e;border-color:#f5b81b}
.tool-btn i{font-size:0.9rem;color:#f5b81b}
.rating{text-align:center;font-size:0.75rem;color:#94a3b8;margin:12px 0 8px;padding-top:12px;border-top:1px solid #334155}
.stars{color:#f5b81b;font-size:1.1rem}
.stars span{cursor:pointer;transition:0.2s;display:inline-block}
.stars span:hover{transform:scale(1.2)}
.consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.consent-overlay.show{display:flex}
.consent-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:20px;max-width:400px;width:100%;text-align:center}
.consent-box .legal-icon{font-size:2.4rem;margin-bottom:8px}
.consent-box h2{color:#f5b81b;font-size:1.1rem;margin-bottom:8px}
.consent-box .legal-text{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:8px 0}
.consent-box .btn-consent{background:#f5b81b;border:none;padding:10px 24px;border-radius:40px;font-weight:700;color:#0a0f1a;cursor:pointer;font-size:0.9rem;margin-top:8px;width:100%;font-family:inherit}
.consent-box .btn-refuse{background:#334155;border:none;padding:8px 20px;border-radius:40px;font-weight:600;color:#94a3b8;cursor:pointer;font-size:0.85rem;margin-top:6px;width:100%;font-family:inherit}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:22px;max-width:420px;width:100%;text-align:center}
.confirm-box .icon{font-size:2.5rem;margin-bottom:8px}
.confirm-box h3{color:#f5b81b;font-size:1.05rem;margin-bottom:10px}
.confirm-box .msg{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:6px 0;text-align:center}
.confirm-box .btn-confirm{background:linear-gradient(135deg,#10b981,#059669);border:none;padding:12px 24px;border-radius:40px;font-weight:700;color:#fff;cursor:pointer;font-size:0.9rem;margin-top:8px;width:100%;font-family:inherit}
.confirm-box .btn-cancel{background:#334155;border:none;padding:10px 24px;border-radius:40px;font-weight:600;color:#cbd5e1;cursor:pointer;font-size:0.85rem;margin-top:6px;width:100%;font-family:inherit}
.secret-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
.secret-modal.show{display:flex}
.secret-box{background:#1e293b;padding:20px;border-radius:24px;text-align:center;border:2px solid #f5b81b;max-width:340px;width:90%}
.secret-box .lock-icon{font-size:2.6rem;color:#f5b81b}
.secret-box h3{color:#f5b81b;margin:6px 0;font-size:1rem}
.secret-box p{color:#cbd5e1;font-size:0.75rem;margin-bottom:10px}
.secret-box input{background:#0f172a;border:2px solid #f5b81b;border-radius:40px;padding:10px 14px;color:#fff;width:100%;margin:10px 0;font-size:0.9rem;text-align:center;letter-spacing:4px;font-family:inherit}
.secret-box .btn-confirm{background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;padding:10px 16px;font-weight:700;color:#0a0f1a;cursor:pointer;width:100%;font-size:0.85rem;font-family:inherit}
.secret-box .btn-close{background:#555;border:none;border-radius:40px;padding:8px 14px;font-weight:700;color:#fff;cursor:pointer;width:100%;margin-top:6px;font-size:0.8rem;font-family:inherit}
.secret-box .btn-reset{background:transparent;border:none;color:#94a3b8;font-size:0.7rem;cursor:pointer;margin-top:8px;text-decoration:underline;font-family:inherit}
.toast-custom{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #f5b81b;color:#fff;padding:8px 18px;border-radius:40px;font-size:0.75rem;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,0.6);text-align:center;max-width:90%;font-weight:500;display:none}
.purchase-prompt{display:none;background:#0f172a;border:2px solid #f59e0b;border-radius:16px;padding:14px;margin:10px 0;text-align:center}
.purchase-prompt.show{display:block}
.purchase-prompt .pp-icon{font-size:2rem;margin-bottom:6px}
.purchase-prompt .pp-title{color:#f59e0b;font-weight:700;font-size:0.95rem;margin-bottom:6px}
.purchase-prompt .pp-msg{color:#cbd5e1;font-size:0.8rem;margin-bottom:10px;line-height:1.5}
.legal-line{font-size:0.55rem;color:#94a3b8;margin-top:8px;border-top:1px solid #334155;padding-top:8px;font-weight:300;text-align:center}
.legal-line strong{color:#f5b81b}
.legal-links-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 8px}
.legal-link-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:6px 12px;font-size:0.7rem;color:#cbd5e1;cursor:pointer;font-family:inherit;transition:0.2s;display:flex;align-items:center;gap:4px}
.legal-link-btn:hover{background:#2d3a4e;border-color:#f5b81b;color:#f5b81b}
.legal-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:4000;padding:16px;backdrop-filter:blur(4px)}
.legal-modal-overlay.show{display:flex}
.legal-modal-box{background:#1e293b;border:2px solid #f5b81b;border-radius:20px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.legal-modal-header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 8px;border-bottom:2px solid #334155}
.legal-modal-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.legal-modal-tabs button{background:#0f172a;border:none;color:#94a3b8;padding:8px 10px;font-size:0.65rem;font-weight:600;cursor:pointer;font-family:inherit;border-radius:10px 10px 0 0;white-space:nowrap;transition:0.2s;display:flex;align-items:center;gap:3px}

.legal-modal-close-x{background:transparent;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;padding:4px 8px;font-family:inherit}

.report-overlay.show{display:flex}
.report-container{background:#fff;color:#1a1a1a;border-radius:16px;max-width:720px;width:100%;padding:30px;direction:ltr}
.report-header{text-align:center;border-bottom:3px solid #f5b81b;padding-bottom:15px;margin-bottom:20px}
.report-header h1{font-size:1.6rem;color:#0a0f1a;margin-bottom:6px}
.report-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;font-size:0.85rem}
.report-info div{padding:8px 12px;background:#f5f5f5;border-radius:8px;border-left:3px solid #f5b81b}
.report-section{margin-bottom:18px}
.report-section h2{font-size:1rem;color:#0a0f1a;border-left:4px solid #f5b81b;padding-left:10px;margin-bottom:12px}
.report-section .sensor-row{display:flex;justify-content:space-between;padding:10px 14px;background:#f9f9f9;border-radius:8px;margin-bottom:6px;font-size:0.85rem;border-left:3px solid #ccc}
.report-verdict{background:#f0f9f0;border-left:4px solid #10b981;padding:16px;border-radius:8px}
.report-disclaimer{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:0.75rem;color:#7c2d12;margin-top:20px}
.report-watermark{text-align:center;font-size:0.7rem;color:#94a3b8;margin-top:24px;padding-top:12px;border-top:1px dashed #cbd5e1;font-style:italic}
.report-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.report-actions button{flex:1;padding:12px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.9rem;min-width:130px;font-family:inherit}
.btn-print-pdf{background:#dc2626;color:#fff}
.btn-close-report{background:#6b7280;color:#fff}
.deep-panel{background:#0a0f1a;border:2px solid #06b6d4;border-radius:16px;padding:14px;margin:12px 0;animation:slideDown .3s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.deep-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #334155}
.deep-title{font-size:0.85rem;font-weight:700;color:#06b6d4}

.deep-section{margin-bottom:12px}

.deep-bar{background:#1e293b;height:6px;border-radius:3px;overflow:hidden}

async function sha256Hex(str){
    if (window.crypto && crypto.subtle){
        try {
            var enc = new TextEncoder().encode(str);
            var buf = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(buf)).map(function(b){
                return b.toString(16).padStart(2,'0');
            }).join('');
        } catch(e){}
    }
    var h1=0x811c9dc5, h2=0x01000193;
    for (var i=0; i<str.length; i++){
        var c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
        h2 = Math.imul(h2 ^ (c+i), 2654435761) >>> 0;
    }

    if (!/^[a-f0-9]{64}$/i.test(s) && !/^fb_[a-f0-9]{16}$/i.test(s))
        localStorage.removeItem(ADMIN_HASH_KEY);
}

function getTotalCredits(){ return isAdmin ? 999 : (freeCredits + paidCredits); }
function updateCreditsDisplay(){
    var el = document.getElementById('creditValue');
    var display = document.getElementById('creditDisplay');
    var hintEl = document.getElementById('creditHint');
    if (!el) return;
    var total = getTotalCredits();
    el.textContent = isAdmin ? '∞' : total;
    if (display){
        display.classList.remove('low','empty');
        if (total === 0) display.classList.add('empty');
        else if (total <= 1) display.classList.add('low');
    }
    if (hintEl){
        if (isAdmin) hintEl.textContent = '👑';
        else if (total === 0) hintEl.textContent = t('credit_hint_empty');
        else if (total <= 1) hintEl.textContent = t('credit_hint_low');
        else hintEl.textContent = t('credit_hint_free');
    }
}
function saveCredits(){
    try { localStorage.setItem(CREDITS_KEY, JSON.stringify({free:freeCredits,paid:paidCredits})); } catch(e){}
}
function loadCredits(){
    try {
        var raw = localStorage.getItem(CREDITS_KEY);
        if (raw){
            var d = JSON.parse(raw);
            freeCredits = typeof d.free === 'number' ? Math.min(Math.max(d.free,0),50) : FREE_CHECKS_BIKE;
            paidCredits = typeof d.paid === 'number' ? Math.min(Math.max(d.paid,0),500) : 0;
        }
    } catch(e){}
}
function consumeOneCredit(){
    if (isAdmin) return true;
    if (freeCredits > 0){ freeCredits--; saveCredits(); updateCreditsDisplay(); return true; }
    if (paidCredits > 0){ paidCredits--; saveCredits(); updateCreditsDisplay(); return true; }
    return false;
}

/* ═══════════════════════════════════════════════════════════════
   📐 DSP
   ═══════════════════════════════════════════════════════════════ */
var DSP = {
    fft: function(re, im){
        var n = re.length; if (n <= 1) return;
        var eR=new Float32Array(n/2), eI=new Float32Array(n/2);
        var oR=new Float32Array(n/2), oI=new Float32Array(n/2);
        for (var i=0; i<n/2; i++){
            eR[i]=re[2*i]; eI[i]=im[2*i];
            oR[i]=re[2*i+1]; oI[i]=im[2*i+1];
        }
        this.fft(eR,eI); this.fft(oR,oI);
        for (var k=0; k<n/2; k++){
            var a = -2*Math.PI*k/n;
            var tR = Math.cos(a)*oR[k] - Math.sin(a)*oI[k];
            var tI = Math.sin(a)*oR[k] + Math.cos(a)*oI[k];
            re[k]=eR[k]+tR; im[k]=eI[k]+tI;
            re[k+n/2]=eR[k]-tR; im[k+n/2]=eI[k]-tI;
        }
    },
    spectrum: function(signal){
        var N = 1; while (N < signal.length) N *= 2;
        var re = new Float32Array(N), im = new Float32Array(N);
        var mean = signal.reduce(function(a,b){return a+b;},0)/signal.length;
        for (var i=0; i<signal.length; i++) re[i] = signal[i]-mean;
        this.fft(re,im);
        var mag = new Float32Array(N/2);
        for (var j=0; j<N/2; j++) mag[j] = Math.sqrt(re[j]*re[j]+im[j]*im[j]);
        return {mag:mag, size:N};
    },
    stats: function(s){
        var n = s.length;
        if (n === 0) return {mean:0,std:0,rms:0,peak:0,crest:0,kurtosis:3,skewness:0};
        var sum=0; for (var i=0;i<n;i++) sum+=s[i];
        var mean=sum/n, m2=0,m3=0,m4=0,peak=0,sumSq=0;
        for (var j=0;j<n;j++){
            var d=s[j]-mean, d2=d*d;
            m2+=d2; m3+=d2*d; m4+=d2*d2;
            if (Math.abs(s[j])>peak) peak=Math.abs(s[j]);
            sumSq+=s[j]*s[j];
        }
        m2/=n; m3/=n; m4/=n;
        var rms=Math.sqrt(sumSq/n), std=Math.sqrt(m2);
        return {mean:mean, std:std, rms:rms, peak:peak,
                crest:std>1e-9?peak/std:0,
                kurtosis:m2>1e-12?m4/(m2*m2):3,
                skewness:m2>1e-12?m3/Math.pow(m2,1.5):0};
    },
    spectralFeat: function(mag, sr){
        var N=mag.length*2, total=0;
        for (var i=0;i<mag.length;i++) total += mag[i];
        if (total < 1e-9) return {centroid:0,rolloff:0,flatness:0,entropy:0};
        var centroid=0;
        for (var j=0;j<mag.length;j++) centroid += (j*sr/N)*mag[j];
        centroid /= total;
        var rolloff=0, acc=0;
        for (var k=0;k<mag.length;k++){ acc+=mag[k]; if (acc>=0.85*total){rolloff=k*sr/N;break;} }
        var logSum=0, entropy=0;
        for (var m=0;m<mag.length;m++){
            var p = mag[m]/total;
            if (p>1e-9){ logSum+=Math.log(p); entropy-=p*Math.log(p); }
        }
        return {centroid:centroid, rolloff:rolloff, flatness:Math.exp(logSum/mag.length), entropy:entropy};
    },
    bandEnergy: function(mag, sr, fLow, fHigh){
        var N = mag.length*2;
        var lo = Math.floor(fLow*N/sr), hi = Math.ceil(fHigh*N/sr);
        if (lo<0) lo=0; if (hi>mag.length) hi=mag.length;
        var e=0; for (var i=lo;i<hi;i++) e += mag[i]*mag[i];
        return e;
    },
    estimateRPM: function(signal, sr){
        var n = signal.length; if (n<256) return 0;
        var mean = signal.reduce(function(a,b){return a+b;},0)/n;
        var s = new Float32Array(n);
        for (var i=0;i<n;i++) s[i] = signal[i]-mean;
        var minLag = Math.floor(sr/100), maxLag = Math.floor(sr/10);
        if (maxLag > n/2) maxLag = Math.floor(n/2);
        var bestLag=minLag, bestCorr=-Infinity;
        for (var lag=minLag; lag<=maxLag; lag++){
            var corr=0, cnt=n-lag;
            if (cnt<100) break;
            for (var j=0;j<cnt;j++) corr += s[j]*s[j+lag];
            corr /= cnt;
            if (corr > bestCorr){ bestCorr=corr; bestLag=lag; }
        }
        if (bestLag <= 0) return 0;
        return Math.round((sr/bestLag)*30);
    },
    mfcc: function(signal, sr, nCoeff){
        nCoeff = nCoeff||13;
        var mag = this.spectrum(signal).mag;
        var nF = 26;
        var mel = function(f){return 2595*Math.log10(1+f/700);};
        var invMel = function(m){return 700*(Math.pow(10,m/2595)-1);};
        var lowM=mel(50), highM=mel(sr/2);
        var pts = []; for (var i=0;i<nF+2;i++) pts.push(invMel(lowM+(highM-lowM)*i/(nF+1)));
        var bins = pts.map(function(f){return Math.floor(f*2*mag.length/sr);});
        var energies = new Float32Array(nF);
        for (var f=0;f<nF;f++){
            var sum=0;
            for (var k=bins[f];k<bins[f+1]&&k<mag.length;k++) sum += mag[k]*(k-bins[f])/(bins[f+1]-bins[f]||1);
            for (var k2=bins[f+1];k2<bins[f+2]&&k2<mag.length;k2++) sum += mag[k2]*(bins[f+2]-k2)/(bins[f+2]-bins[f+1]||1);
            energies[f] = Math.log(sum+1e-10);
        }
        var out = new Float32Array(nCoeff);
        for (var c=0;c<nCoeff;c++){
            var s2=0;
            for (var nn=0;nn<nF;nn++) s2 += energies[nn]*Math.cos(Math.PI*c*(nn+0.5)/nF);
            out[c] = s2;
        }
        return Array.from(out);
    }
};

var SignalGate = {
    MIN_SNR_DB: 15,
    check: function(spectrum, sr){
        var sig = DSP.bandEnergy(spectrum.mag, sr, 20, 4000);
        var noise = DSP.bandEnergy(spectrum.mag, sr, 4000, 10000);
        var snr = 10*Math.log10((sig+1e-10)/(noise+1e-10));
        return {pass: snr >= this.MIN_SNR_DB, snr: Math.round(snr*10)/10};
    }
};

function faultName(fault){
    if (!fault || !fault.names) return '—';
    return fault.names[currentLang] || fault.names.en || fault.names.ar || '—';
}

function scoreFamily(key, feat, rpm){
    var family = FAULT_FAMILIES[key];
    if (!family) return {score:0, topFault:null};
    var totalW=0, totalS=0, scores=[];
    family.faults.forEach(function(flt){
        var s=0; try { s=flt.rule(feat,rpm); } catch(e){ s=0; }
        if (!isFinite(s)) s=0;
        s = Math.max(0,Math.min(1,s));
        var w = flt.weight||1;
        totalS += s*w; totalW += w;
        scores.push({fault:flt, score:s});
    });
    scores.sort(function(a,b){return b.score-a.score;});
    return {score: totalW>0?totalS/totalW:0, topFault:scores[0]?scores[0].fault:null};
}
function scoreAllFamilies(feat, rpm){
    var res = [];
    Object.keys(FAULT_FAMILIES).forEach(function(k){
        var r = scoreFamily(k, feat, rpm);
        res.push({key:k, family:FAULT_FAMILIES[k], score:r.score, topFault:r.topFault});
    });
    res.sort(function(a,b){return b.score-a.score;});
    return res;
}

/* ═══════════════════════════════════════════════════════════════
   🎤 EXTRACTORS
   ═══════════════════════════════════════════════════════════════ */
async function extractAudioFeatures(){
    return new Promise(async function(resolve){
        try {
            var stream = await navigator.mediaDevices.getUserMedia({
                audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
            });
            var AC = window.AudioContext || window.webkitAudioContext;
            var ctx = new AC();
            var src = ctx.createMediaStreamSource(stream);
            var an = ctx.createAnalyser();
            an.fftSize = 4096;
            src.connect(an);
            var sr = ctx.sampleRate;
            var timeData = new Float32Array(an.fftSize);
            var freqData = new Uint8Array(an.frequencyBinCount);
            var timeSamples = [];
            var magAccum = new Float32Array(an.frequencyBinCount);
            var t0 = Date.now(), frames = 0;
            while (Date.now() - t0 < 12000){
                an.getFloatTimeDomainData(timeData);
                an.getByteFrequencyData(freqData);
                for (var i=0; i<512; i++) timeSamples.push(timeData[i]);
                for (var j=0; j<freqData.length; j++) magAccum[j] += freqData[j];
                frames++;
                await new Promise(function(r){ setTimeout(r,50); });
            }
            stream.getTracks().forEach(function(tr){ tr.stop(); });
            ctx.close();
            var mag = new Float32Array(magAccum.length);
            for (var k=0; k<mag.length; k++) mag[k] = magAccum[k]/frames;
            var q = SignalGate.check({mag:mag,size:an.fftSize}, sr);
            if (!q.pass){ resolve({ok:false, reason:'LOW_SNR', snr:q.snr}); return; }
            var s = DSP.stats(timeSamples.slice(0,8192));
            var sp = DSP.spectralFeat(mag, sr);
            var rpm = DSP.estimateRPM(timeSamples.slice(0,8192), sr);
            var be = {
                0:DSP.bandEnergy(mag,sr,20,500), 1:DSP.bandEnergy(mag,sr,500,2000),
                2:DSP.bandEnergy(mag,sr,2000,6000), 3:DSP.bandEnergy(mag,sr,6000,12000)
            };
            var tot = (be[0]+be[1]+be[2]+be[3]) + 1e-10;
            resolve({ok:true, snr:q.snr, rpm:rpm, stats:s, spectral:sp,
                     bandEnergy:be, totalEnergy:tot, sampleRate:sr, mag:mag});
        } catch(e){ resolve({ok:false, reason:'MIC_DENIED'}); }
    });
}
async function extractVibrationFeatures(){
    return new Promise(function(resolve){
        if (typeof DeviceMotionEvent === 'undefined'){
            resolve({ok:false, reason:'NO_ACCEL'}); return;
        }
        var samples = {x:[],y:[],z:[]};
        var handler = function(e){
            var a = e.accelerationIncludingGravity || e.acceleration;
            if (!a) return;
            samples.x.push(a.x||0); samples.y.push(a.y||0); samples.z.push(a.z||0);
        };
        window.addEventListener('devicemotion', handler);
        setTimeout(function(){
            window.removeEventListener('devicemotion', handler);
            if (samples.x.length < 100){ resolve({ok:false, reason:'FEW_SAMPLES'}); return; }
            var sr = 60;
            var mag = new Array(samples.x.length);
            for (var i=0; i<samples.x.length; i++)
                mag[i] = Math.sqrt(samples.x[i]*samples.x[i]+samples.y[i]*samples.y[i]+samples.z[i]*samples.z[i]);
            var st = DSP.stats(mag);
            var sp = DSP.spectrum(mag);
            var spf = DSP.spectralFeat(sp.mag, sr);
            var tot = 0; for (var j=0; j<sp.mag.length; j++) tot += sp.mag[j]*sp.mag[j];
            tot += 1e-10;
            var hf = DSP.bandEnergy(sp.mag, sr, 15, 30)/tot;
            resolve({ok:true, stats:st, spectral:spf, mag:sp.mag, sampleRate:sr,
                     totalEnergy:tot, highFreqRatio:hf});
        }, 12000);
    });
}
async function extractSmokeFeatures(){
    return new Promise(async function(resolve){
        try {
            var stream = await navigator.mediaDevices.getUserMedia({
                video:{facingMode:'environment', width:640, height:480}
            });
            var video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline','true');
            video.muted = true;
            await video.play();
            await new Promise(function(r){setTimeout(r,500);});
            var canvas = document.createElement('canvas');
            canvas.width=224; canvas.height=224;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(video,0,0,224,224);
            var td0 = ctx.getImageData(0,0,224,224).data;
            var br0=0; for (var i=0;i<td0.length;i+=4) br0+=td0[i];
            br0 /= (td0.length/4);
            if (br0 < 10 || br0 > 250){
                stream.getTracks().forEach(function(tr){tr.stop();});
                resolve({ok:false, reason:'IMG_QUALITY'}); return;
            }
            var frames = [];
            for (var f=0; f<8; f++){
                ctx.drawImage(video,0,0,224,224);
                frames.push(ctx.getImageData(0,0,224,224));
                await new Promise(function(r){setTimeout(r,1000);});
            }
            stream.getTracks().forEach(function(tr){tr.stop();});
            var last = frames[frames.length-1].data;
            var rs=0, gs=0, bs=0, n=0;
            for (var k=0; k<last.length; k+=4){ rs+=last[k]; gs+=last[k+1]; bs+=last[k+2]; n++; }
            var r=rs/n, g=gs/n, b=bs/n;
            var maxC=Math.max(r,g,b), minC=Math.min(r,g,b);
            var sat = maxC>0 ? (maxC-minC)/maxC : 0;
            var flow = 0;
            for (var p=1; p<frames.length; p++){
                var f1=frames[p-1].data, f2=frames[p].data;
                var d=0; for (var q=0; q<f1.length; q+=16) d += Math.abs(f1[q]-f2[q]);
                flow += d/(f1.length/16);
            }
            flow /= (frames.length-1);
            var edge=0;
            for (var y=1; y<223; y++) for (var x=1; x<223; x++){
                var idx=(y*224+x)*4;
                var gx=Math.abs(last[idx]-last[idx+4]);
                var gy=Math.abs(last[idx]-last[idx+224*4]);
                edge += Math.sqrt(gx*gx+gy*gy);
            }
            var edgeD = edge/(223*223);
            resolve({ok:true, r:r, g:g, b:b, brightness:(r+g+b)/3,
                     saturation:sat, flowVariance:flow, edgeDensity:edgeD});
        } catch(e){ resolve({ok:false, reason:'CAM_DENIED'}); }
    });
}

var VehiclePipeline = {
    process: function(raw){
        var feat = {};
        if (raw.audio && raw.audio.ok) feat.audio = raw.audio;
        if (raw.vibration && raw.vibration.ok) feat.vibration = raw.vibration;
        if (raw.smoke && raw.smoke.ok) feat.smoke = raw.smoke;
        var validCount = Object.keys(feat).length;
        if (validCount === 0) return {ok:false, reason:'NO_SIGNALS'};
        var rpm = feat.audio ? feat.audio.rpm : null;
        return {ok:true, features:feat, ranking:scoreAllFamilies(feat, rpm),
                rpm:rpm, validCount:validCount, snr:feat.audio?feat.audio.snr:null};
    }
};

function updateAllSensorUIs(){ for (var id=1; id<=3; id++) updateSensorUI(id); }
function updateSensorUI(id){
    var card = document.getElementById('card'+id);
    var preview = document.getElementById('previewText'+id);
    var result = document.getElementById('result'+id);
    var subResult = document.getElementById('subResult'+id);
    var mBtn = document.getElementById('measure'+id);
    var rBtn = document.getElementById('retry'+id);
    var dBtn = document.getElementById('done'+id);
    var sBtn = document.getElementById('skip'+id);
    if (!card) return;
    mBtn.disabled = true; rBtn.disabled = true; dBtn.disabled = true; sBtn.disabled = false;
    var st = sensorState[id];
    card.className = 'sensor-card';
    if (st.status === 'measuring'){ card.classList.add('measuring'); preview.textContent = '⏳ ' + tFormat('measuring',0); sBtn.disabled = true; return; }
    if (st.status === 'done' && st.confirmed){ card.classList.add('confirmed'); preview.textContent = '✅ ' + t('confirmed_msg'); result.textContent = '📊 ' + (st.value||''); subResult.textContent = st.sub||''; rBtn.disabled = false; sBtn.disabled = false; return; }
    if (st.status === 'done'){ card.classList.add('done'); preview.textContent = '✅ ' + t('measure_done'); result.textContent = '📊 ' + (st.value||''); subResult.textContent = st.sub||''; rBtn.disabled = false; dBtn.disabled = false; sBtn.disabled = false; return; }
    if (st.status === 'failed'){ card.classList.add('failed'); preview.textContent = '⚠️ ' + t('measure_failed'); result.textContent=''; subResult.textContent=''; mBtn.disabled=false; rBtn.disabled=false; sBtn.disabled=false; return; }
    if (st.status === 'skipped'){ card.classList.add('skipped'); preview.textContent = '⏭ ' + t('skipped_msg'); result.textContent=''; subResult.textContent=''; mBtn.disabled=false; sBtn.disabled=false; return; }
    preview.textContent = '🔓 ' + t('waiting'); result.textContent=''; subResult.textContent='';
    mBtn.disabled = false; sBtn.disabled = false;
}
async function measureSensor(id){
    if (!consentGiven){ document.getElementById('consentOverlay').classList.add('show'); return; }
    if (sensorState[id].status === 'measuring') return;
    if ([1,2,3].some(function(i){return sensorState[i].status === 'measuring';})) return;
    if (id === 1) await measureAudioOnly();
    else if (id === 2) await measureSmokeOnly();
    else if (id === 3) await measureVibrationOnly();
}
async function measureAudioOnly(){
    sensorState[1] = {status:'measuring',value:null,sub:null,confirmed:false};
    updateSensorUI(1);
    showToast('🎤 ' + tFormat('measuring',12));
    var r = await extractAudioFeatures();
    if (!r || !r.ok){
        sensorState[1] = {status:'failed',value:null,sub:null,confirmed:false};
        updateSensorUI(1);
        showToast('❌ ' + ((r && r.reason === 'LOW_SNR') ? t('no_signal') : t('measure_failed')));
        return;
    }
    window._sensorResults.audio = r;
    sensorState[1] = {status:'done',
        value: r.spectral.centroid.toFixed(0) + ' Hz',
        sub: t('deep_snr') + ': ' + r.snr + ' dB' + (r.rpm ? ' | ' + t('deep_rpm') + ': ' + r.rpm : ''),
        confirmed: false};
    updateSensorUI(1);
    showToast('✅ ' + t('measure_done'));
}
async function measureSmokeOnly(){
    sensorState[2] = {status:'measuring',value:null,sub:null,confirmed:false};
    updateSensorUI(2);
    showToast('📸 ' + tFormat('measuring',8));
    var r = await extractSmokeFeatures();
    if (!r || !r.ok){
        sensorState[2] = {status:'failed',value:null,sub:null,confirmed:false};
        updateSensorUI(2); showToast('❌ ' + t('measure_failed')); return;
    }
    window._sensorResults.smoke = r;
    sensorState[2] = {status:'done', value: r.brightness.toFixed(0),
        sub: 'R:' + r.r.toFixed(0) + ' G:' + r.g.toFixed(0) + ' B:' + r.b.toFixed(0),
        confirmed: false};
    updateSensorUI(2);
    showToast('✅ ' + t('measure_done'));
}
async function measureVibrationOnly(){
    sensorState[3] = {status:'measuring',value:null,sub:null,confirmed:false};
    updateSensorUI(3);
    showToast('📳 ' + tFormat('measuring',12));
    var r = await extractVibrationFeatures();
    if (!r || !r.ok){
        sensorState[3] = {status:'failed',value:null,sub:null,confirmed:false};
        updateSensorUI(3); showToast('❌ ' + t('measure_failed')); return;
    }
    window._sensorResults.vibration = r;
    sensorState[3] = {status:'done', value: r.stats.rms.toFixed(2) + ' m/s²',
        sub: 'CF: ' + r.stats.crest.toFixed(2), confirmed: false};
    updateSensorUI(3);
    showToast('✅ ' + t('measure_done'));
}
function retrySensor(id){
    cleanupStreams(id);
    sensorState[id] = {status:'idle',value:null,sub:null,confirmed:false};
    if (id === 1) window._sensorResults.audio = null;
    else if (id === 2) window._sensorResults.smoke = null;
    else if (id === 3) window._sensorResults.vibration = null;
    updateSensorUI(id);
    document.getElementById('finalVerdict').classList.remove('show');
    document.getElementById('deepPanel').style.display = 'none';
    window._deepResult = null;
}
function confirmSensor(id){
    if (sensorState[id].status !== 'done'){ showToast('⚠️ ' + t('not_measured')); return; }
    sensorState[id].confirmed = true;
    updateSensorUI(id);
    showToast('✅ ' + t('confirmed_msg'));
}
function skipSensor(id){
    cleanupStreams(id);
    sensorState[id] = {status:'skipped',value:null,sub:null,confirmed:false};
    if (id === 1) window._sensorResults.audio = null;
    else if (id === 2) window._sensorResults.smoke = null;
    else if (id === 3) window._sensorResults.vibration = null;
    updateSensorUI(id);
}
function cleanupStreams(id){
    if (id === 1 && streams.audio){
        try { streams.audio.getTracks().forEach(function(t){t.stop();}); } catch(e){}
        streams.audio = null;
        if (streams.audioContext){ try { streams.audioContext.close(); } catch(e){} streams.audioContext = null; }
    }
    if (id === 2 && streams.video){
        try { streams.video.getTracks().forEach(function(t){t.stop();}); } catch(e){}
        streams.video = null;
    }
    if (id === 3 && motionHandler){
        window.removeEventListener('devicemotion', motionHandler);
        motionHandler = null;
    }
}

function getMeasuredCount(){ return [1,2,3].filter(function(i){return sensorState[i].status === 'done';}).length; }
function getSkippedCount(){ return [1,2,3].filter(function(i){return sensorState[i].status === 'skipped';}).length; }

function requestFinalVerdict(){
    var measured = getMeasuredCount();
    var skipped = getSkippedCount();
    if (measured === 0){ showToast('⚠️ ' + t('sensor_count_0')); return; }
    var icon = document.getElementById('finalConfirmIcon');
    var title = document.getElementById('finalConfirmTitle');
    var msg = document.getElementById('finalConfirmMsg');
    var yes = document.getElementById('finalConfirmYes');
    var no = document.getElementById('finalConfirmNo');
    var yesL = document.getElementById('finalConfirmYesLabel');
    var noL = document.getElementById('finalConfirmNoLabel');
    icon.textContent = '📊';
    title.textContent = t('final_confirm_title');
    var countMsg = measured === 3 ? t('sensor_count_3') :
                   measured === 2 ? t('sensor_count_2') : t('sensor_count_1');
    var incompleteNote = '';
    if (measured < 3){
        var remaining = 3 - measured - skipped;
        if (remaining > 0){
            incompleteNote = '<div style="margin-top:10px;padding:8px 10px;background:#7c2d1222;border:1px solid #f59e0b;border-radius:8px;font-size:0.75rem;color:#fbbf24;text-align:right">⚠️ ' + tFormat('confirm_incomplete', remaining) + '</div>';
        }
    }
    msg.innerHTML = '<span style="color:#06b6d4;font-weight:700">' + countMsg + '</span><br><br>' +
                    '<span style="color:#f59e0b;font-weight:600">' + t('confirm_deduct') + '</span>' + incompleteNote;
    yesL.textContent = t('final_confirm_yes');
    noL.textContent = t('final_confirm_no');
    yes.onclick = confirmFinalVerdict;
    no.onclick = cancelFinalVerdict;
    document.getElementById('finalConfirmOverlay').classList.add('show');
}
function cancelFinalVerdict(){ document.getElementById('finalConfirmOverlay').classList.remove('show'); }
function confirmFinalVerdict(){
    document.getElementById('finalConfirmOverlay').classList.remove('show');
    var measured = getMeasuredCount();
    if (measured === 0){ showToast('⚠️ ' + t('sensor_count_0')); return; }
    var raw = {
        audio: window._sensorResults.audio || {ok:false},
        vibration: window._sensorResults.vibration || {ok:false},
        smoke: window._sensorResults.smoke || {ok:false}
    };
    var deep = VehiclePipeline.process(raw);
    window._deepResult = deep;
    if (!isAdmin){
        if (!consumeOneCredit()){
            showToast('⚠️ ' + t('no_credits'));
            document.getElementById('purchasePrompt').classList.add('show');
            return;
        }
    }
    finalShown = true;
    renderFinalVerdict();
}
function renderFinalVerdict(){
    var deep = window._deepResult;
    var fv = document.getElementById('finalVerdict');
    var icon = document.getElementById('finalIcon');
    var sentence = document.getElementById('verdictSentence');
    var solDiv = document.getElementById('verdictSolution');
    var countNotice = document.getElementById('sensorCountNotice');
    fv.className = 'final-verdict show';
    fv.style.display = 'block';
    if (!deep || !deep.ok){
        fv.classList.add('gray'); icon.textContent = '⚠️';
        sentence.textContent = t('no_data');
        solDiv.style.display = 'none';
        countNotice.className = 'sensor-count-notice none';
        countNotice.textContent = t('sensor_count_0');
        return;
    }
    if (deep.validCount === 3){ countNotice.className = 'sensor-count-notice good'; countNotice.textContent = t('sensor_count_3'); }
    else if (deep.validCount === 2){ countNotice.className = 'sensor-count-notice partial'; countNotice.textContent = t('sensor_count_2'); }
    else { countNotice.className = 'sensor-count-notice limited'; countNotice.textContent = t('sensor_count_1'); }
    var top = deep.ranking[0];
    if (!top || top.score <= 0.01){
        fv.classList.add('yellow'); icon.textContent = '🟡';
        sentence.textContent = t('no_match');
        solDiv.textContent = t('no_match_desc');
        solDiv.style.display = 'block';
        solDiv.style.color = '#fff';
        return;
    }
    var conf = Math.round(top.score * 100);
    if (conf >= 60) fv.classList.add('green');
    else if (conf >= 30) fv.classList.add('yellow');
    else fv.classList.add('orange');
    icon.textContent = conf >= 60 ? '🟢' : conf >= 30 ? '🟡' : '🟠';
    var html = '<div style="font-size:1.15rem;margin-bottom:8px">' + top.family.icon + ' ' + t(top.family.nameKey) + '</div>';
    if (top.topFault) html += '<div style="font-size:0.9rem;color:#cbd5e1;margin-bottom:6px">→ ' + faultName(top.topFault) + '</div>';
    html += '<div style="font-size:0.85rem;opacity:0.85">' + t('confidence_label') + ': ' + conf + '%</div>';
    sentence.innerHTML = html;
    sentence.style.color = '#fff';
    var alt = '';
    var alts = deep.ranking.slice(1,4).filter(function(r){return r.score > 0.05;});
    if (alts.length > 0){
        alt += '<div style="font-size:0.8rem;color:#94a3b8;margin-bottom:6px">' + t('deep_top_families') + ':</div>';
        alts.forEach(function(item){
            var pct = Math.round(item.score*100);
            alt += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.8rem">' +
                '<span>' + item.family.icon + ' ' + t(item.family.nameKey) + '</span>' +
                '<span style="color:' + item.family.color + ';font-family:monospace">' + pct + '%</span></div>';
        });
    }
    if (deep.rpm) alt += '<div style="margin-top:10px;font-size:0.75rem;color:#94a3b8;font-family:monospace">' + t('deep_rpm') + ' ≈ ' + deep.rpm + '</div>';
    if (alt){ solDiv.innerHTML = alt; solDiv.style.display = 'block'; solDiv.style.color = 'inherit'; }
    else solDiv.style.display = 'none';
    renderPhysicalPanel(deep);
    fv.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderPhysicalPanel(deep){
    if (!deep || !deep.ok) return;
    var panel = document.getElementById('deepPanel');
    panel.style.display = 'block';
    document.getElementById('deepPanelTitle').textContent = t('deep_panel_title');
    document.getElementById('lblQuality').textContent = t('deep_quality');
    document.getElementById('lblSNR').textContent = t('deep_snr');
    document.getElementById('lblTopFamilies').textContent = t('deep_top_families');
    document.getElementById('lblRPM').textContent = t('deep_rpm');
    var snr = deep.snr || 0;
    var qPct = Math.min(100, Math.max(0, (snr-15)*4));
    document.getElementById('valQuality').textContent = Math.round(qPct) + '%';
    document.getElementById('barQuality').style.width = qPct + '%';
    document.getElementById('valSNR').textContent = snr + ' dB';
    document.getElementById('barSNR').style.width = Math.min(100, snr*3.3) + '%';
    if (deep.rpm){
        document.getElementById('rpmSection').style.display = 'block';
        document.getElementById('valRPM').textContent = deep.rpm + ' RPM';
    } else document.getElementById('rpmSection').style.display = 'none';
    var list = document.getElementById('topFamiliesList');
    list.innerHTML = '';
    deep.ranking.slice(0,5).forEach(function(item, idx){
        var pct = Math.round(item.score*100);
        if (pct <= 0 && idx > 0) return;
        var row = document.createElement('div');
        row.className = 'family-row' + (idx === 0 ? ' primary' : '');
        row.innerHTML = '<span class="fam-icon">' + item.family.icon + '</span>' +
            '<span class="fam-name">' + t(item.family.nameKey) + '</span>' +
            '<div class="fam-mini-bar"><div class="fam-mini-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="fam-pct">' + pct + '%</span>';
        list.appendChild(row);
    });
}

    document.getElementById('labArea').scrollIntoView({behavior:'smooth', block:'start'});
    for (var i=1; i<=3; i++){
        cleanupStreams(i);
        sensorState[i] = {status:'idle',value:null,sub:null,confirmed:false};
        updateSensorUI(i);
    }
    window._sensorResults = {audio:null,vibration:null,smoke:null};
    finalShown = false; userNote = '';
    document.getElementById('noteTextArea').value = '';
    document.getElementById('noteTextArea').style.display = 'none';
    document.getElementById('finalVerdict').classList.remove('show');
    document.getElementById('deepPanel').style.display = 'none';
    window._deepResult = null;
}
function toggleNoteText(){
    var ta = document.getElementById('noteTextArea');
    if (ta.style.display === 'block'){ ta.style.display = 'none'; userNote = ta.value; }
    else { ta.style.display = 'block'; ta.focus(); }

function startVoiceNote(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ showToast('⚠️ ' + t('voice_not_supported')); toggleNoteText(); return; }
    if (isRecording) return;
    isRecording = true;
    document.getElementById('recordingIndicator').classList.add('active');
    document.getElementById('speakBtn').disabled = true;
    recognition = new SR();
    var map = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',it:'it-IT',pt:'pt-PT',ru:'ru-RU',zh:'zh-CN',ja:'ja-JP',ko:'ko-KR',hi:'hi-IN',tr:'tr-TR',id:'id-ID',ms:'ms-MY',vi:'vi-VN',th:'th-TH',nl:'nl-NL',pl:'pl-PL',sv:'sv-SE',fa:'fa-IR',ur:'ur-PK',sw:'sw-KE'};
    recognition.lang = map[currentLang] || 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function(e){
        var text = e.results[0][0].transcript;
        var ta = document.getElementById('noteTextArea');
        ta.style.display = 'block';
        ta.value = (ta.value ? ta.value + ' ' : '') + text;
        userNote = ta.value;
    };
    recognition.onerror = function(){};
    recognition.onend = function(){ stopVoiceNote(); };
    try { recognition.start(); } catch(e){ stopVoiceNote(); }
    recordingTimeout = setTimeout(function(){ stopVoiceNote(); }, 5000);
}
function stopVoiceNote(){
    if (!isRecording) return;
    isRecording = false;
    clearTimeout(recordingTimeout);
    document.getElementById('recordingIndicator').classList.remove('active');
    document.getElementById('speakBtn').disabled = false;
    try { if (recognition) recognition.stop(); } catch(e){}
    var ta = document.getElementById('noteTextArea');
    if (ta) userNote = ta.value;
}

    var text = finalShown ? document.getElementById('verdictSentence').textContent : t('app_title');

    u.lang = map[currentLang] || 'en-US';

    speechSynthesis.speak(u);
}

function getReportText(){
    var now = new Date();
    var lines = ['🏍️ Motorcycle Engine Symptom Estimator', '════════════════════════'];
    lines.push('📅 ' + t('report_date') + ': ' + now.toLocaleDateString('en-GB'));
    lines.push('🕐 ' + t('report_time') + ': ' + now.toLocaleTimeString('en-GB'));
    lines.push('🆔 ' + t('report_device') + ': ' + document.getElementById('deviceId').textContent);
    if (locationStatus && !['denied','unavailable','na'].includes(locationStatus)) lines.push('📍 GPS: ' + locationStatus);
    lines.push('════════════════════════');
    lines.push('📊 ' + t('report_sensors_used') + ':');
    for (var i=1; i<=3; i++){
        var st = sensorState[i];
        var icon = i===1 ? '🎤' : i===2 ? '📸' : '📳';
        if (st.status === 'done' && st.confirmed) lines.push('  ✅ ' + icon + ' ' + t('sensor'+i) + ' — ' + (st.value||''));
        else if (st.status === 'done') lines.push('  ⚡ ' + icon + ' ' + t('sensor'+i) + ' — ' + (st.value||''));
        else if (st.status === 'skipped') lines.push('  ⏭ ' + icon + ' ' + t('sensor'+i) + ' (' + t('skipped_msg') + ')');
        else lines.push('  ⬜ ' + icon + ' ' + t('sensor'+i) + ' (' + t('not_measured') + ')');
    }
    lines.push('════════════════════════');
    if (finalShown){
        var deep = window._deepResult;
        if (deep && deep.ok && deep.ranking && deep.ranking.length > 0){
            var top = deep.ranking[0];
            lines.push('📋 ' + t('report_verdict') + ':');
            lines.push(top.family.icon + ' ' + t(top.family.nameKey));
            if (top.topFault) lines.push('→ ' + faultName(top.topFault));
            lines.push(t('confidence_label') + ': ' + Math.round(top.score*100) + '%');
            lines.push('');
            lines.push(document.getElementById('sensorCountNotice').textContent);
        } else { lines.push('⚠️ ' + t('no_match')); lines.push(t('no_match_desc')); }
    } else lines.push('⚠️ ' + t('no_data'));
    if (userNote && userNote.length >= 4){ lines.push('════════════════════════'); lines.push('💭 ' + userNote); }
    lines.push('════════════════════════');
    lines.push('⚠️ ' + t('legal'));
    lines.push('© 2026 Motorcycle Engine Symptom Estimator');
    return lines.join('\n');
}
function printReport(){
    if (!finalShown){ showToast('⚠️ ' + t('final_btn_label')); return; }
    var container = document.getElementById('reportContainer');
    var now = new Date();
    var sensorRows = '';
    for (var i=1; i<=3; i++){
        var st = sensorState[i];
        var icon = i===1 ? '🎤' : i===2 ? '📸' : '📳';
        var statusText = t('not_measured'), valueText = '—';
        if (st.status === 'done' && st.confirmed){ statusText = '✅ ' + t('confirmed_msg'); valueText = st.value||'—'; }
        else if (st.status === 'done'){ statusText = '⚡ ' + t('measure_done'); valueText = st.value||'—'; }
        else if (st.status === 'skipped') statusText = '⏭ ' + t('skipped_msg');
        sensorRows += '<div class="sensor-row"><span>' + icon + ' ' + t('sensor'+i) + '</span><span>' + statusText + ' | ' + valueText + '</span></div>';
    }
    var deep = window._deepResult;
    var verdictText = t('no_data'), solutionText = '';
    if (deep && deep.ok && deep.ranking && deep.ranking.length > 0){
        var top = deep.ranking[0];
        verdictText = top.family.icon + ' ' + t(top.family.nameKey);
        if (top.topFault) verdictText += ' — ' + faultName(top.topFault);
        verdictText += ' (' + Math.round(top.score*100) + '%)';
        var alts = deep.ranking.slice(1,4).filter(function(r){return r.score>0.05;});
        if (alts.length > 0){
            solutionText = t('deep_top_families') + ': ';
            solutionText += alts.map(function(item){ return item.family.icon + ' ' + t(item.family.nameKey) + ' (' + Math.round(item.score*100) + '%)'; }).join(' · ');
        }
    } else if (deep && deep.ok){ verdictText = '⚠️ ' + t('no_match'); solutionText = t('no_match_desc'); }
    var sensorCount = document.getElementById('sensorCountNotice').textContent || '';
    var noteText = (document.getElementById('noteTextArea').value || '').trim();
    var html = '';
    html += '<div class="report-header"><h1>🏍️ Motorcycle Engine Symptom Estimator</h1></div>';
    html += '<div class="report-info">';
    html += '<div><strong>' + t('report_device') + '</strong>' + document.getElementById('deviceId').textContent + '</div>';
    html += '<div><strong>' + t('report_date') + '</strong>' + now.toLocaleDateString('en-GB') + '</div>';
    html += '<div><strong>' + t('report_time') + '</strong>' + now.toLocaleTimeString('en-GB') + '</div>';
    html += '</div>';
    html += '<div class="report-section"><h2>📊 ' + t('report_sensors_used') + '</h2>' + sensorRows + '</div>';
    html += '<div class="report-section"><h2>📋 ' + t('report_verdict') + '</h2>';
    html += '<div class="report-verdict"><p>' + verdictText + '</p>';
    if (solutionText) html += '<div style="color:#166534;margin-top:8px">🔧 ' + solutionText + '</div>';
    html += '</div>';
    html += '<div style="text-align:center;font-size:0.75rem;color:#666;margin-top:8px">' + sensorCount + '</div></div>';
    if (noteText.length >= 4)
        html += '<div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:0.85rem;color:#78350f">💭 ' + noteText + '</div>';
    html += '<div class="report-disclaimer">⚠️ ' + t('legal') + '</div>';
    html += '<div class="report-watermark">© 2026 Motorcycle Engine Symptom Estimator</div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-print-pdf" onclick="window.print()">' + t('report_print_pdf') + '</button>';
    html += '<button class="btn-close-report" onclick="closeReport()">✖ ' + t('report_close_btn') + '</button>';
    html += '</div>';
    container.innerHTML = html;
    document.getElementById('reportOverlay').classList.add('show');
}

async function verifyGumroadLicense(key){
    var permalinks = Object.keys(GUMROAD_BIKE.permalinks);
    for (var i=0; i<permalinks.length; i++){
        var permalink = GUMROAD_BIKE.permalinks[permalinks[i]];
        try {
            var res = await fetch('https://api.gumroad.com/v2/licenses/verify', {
                method:'POST',
                headers:{'Content-Type':'application/x-www-form-urlencoded'},
                body: new URLSearchParams({product_permalink: permalink, license_key: key, increment_uses_count: 'false'}).toString()
            });
            var data = await res.json();
            if (data && data.success && data.purchase && !data.purchase.refunded && !data.purchase.chargebacked){
                try {
                    await fetch('https://api.gumroad.com/v2/licenses/verify', {
                        method:'POST',
                        headers:{'Content-Type':'application/x-www-form-urlencoded'},
                        body: new URLSearchParams({product_permalink: permalink, license_key: key, increment_uses_count: 'true'}).toString()
                    });
                } catch(e){}
                return {valid:true, credits:parseInt(permalinks[i]), uses:data.uses||0};
            }
        } catch(e){}
    }
    return {valid:false};
}
async function activateCode(){
    var input = document.getElementById('codeInput');
    var code = input.value.trim();
    if (!code) return;
    var btn = document.getElementById('activateBtn');
    btn.disabled = true;
    showToast('⏳ ' + t('verifying'));
    try {
        var result = await verifyGumroadLicense(code);
        if (result.valid){
            if (result.uses > 1) showToast('⚠️ ' + t('license_already_used'));
            else {
                paidCredits += result.credits;
                saveCredits();
                updateCreditsDisplay();
                showToast('✅ ' + tFormat('license_activated', result.credits));
                document.getElementById('purchasePrompt').classList.remove('show');
            }
        } else showToast('❌ ' + t('invalid'));
    } catch(e){ showToast('❌ ' + t('network_error')); }
    input.value = '';
    btn.disabled = false;
}

    navigator.geolocation.getCurrentPosition(
        function(pos){ locationStatus = pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4); el.textContent = locationStatus; },
        function(){ locationStatus = 'denied'; el.textContent = t('location_denied'); },
